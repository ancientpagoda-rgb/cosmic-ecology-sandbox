<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Reality Engine V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#def3ff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.glass{background:#07131ddd;border:1px solid #91bdd03d;backdrop-filter:blur(11px)}.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:8px 11px;border-radius:999px;font-size:11px}.stats{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;padding:9px 11px;border-radius:12px;font:10px/1.5 ui-monospace,SFMono-Regular,monospace;color:#bad9eb}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px}.top{display:flex;justify-content:space-between;gap:10px;font-size:11px}.region{margin-top:6px;font:10px/1.35 ui-monospace,SFMono-Regular,monospace;color:#9fc5da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;margin-top:8px}.row label,.row output{font-size:10px;color:#abc8d9}.row input{width:100%;accent-color:#8fd0ff}.move{position:fixed;right:14px;bottom:145px;display:grid;grid-template-columns:48px 48px;gap:8px}.move button{height:48px;border-radius:14px;color:#effaff;font-size:20px}.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:11px 15px;border-radius:12px;font-size:13px}.error{max-width:80vw;text-align:center;line-height:1.4}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading" class="loading glass">Starting persistent world…</div>
<div id="badge" class="badge glass">ENGINE V4 · LIVING SPHERE</div>
<div id="stats" class="stats glass">LOD 0<br>0 tiles<br>2,592 cells</div>
<div class="move"><button id="forward" class="glass">▲</button><button id="back" class="glass">▼</button></div>
<section class="hud glass">
  <div class="top"><span id="mode">Orbital camera</span><span id="coords">0.0°, 0.0°</span></div>
  <div id="region" class="region">Loading climate and ecology…</div>
  <div class="row"><label>ALTITUDE</label><input id="altitude" type="range" min="0" max="1" step="0.001" value="0"><output id="altText">12,000 km</output></div>
  <div class="row"><label>TIME</label><input id="timeSpeed" type="range" min="0" max="6" step="0.01" value="2.2"><output id="year">0 yr</output></div>
</section>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view');
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
const loading=document.getElementById('loading');
const badge=document.getElementById('badge'),stats=document.getElementById('stats'),mode=document.getElementById('mode'),coords=document.getElementById('coords'),region=document.getElementById('region'),altitude=document.getElementById('altitude'),altText=document.getElementById('altText'),timeSpeed=document.getElementById('timeSpeed'),year=document.getElementById('year');
addEventListener('error',e=>{if(loading?.isConnected){loading.classList.add('error');loading.textContent='V4 error: '+e.message;}});
if(!gl){loading.classList.add('error');loading.textContent='WebGL 2 is unavailable on this device.';return;}

const vs=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aColor;
uniform vec3 uCamera,uRight,uUp,uForward,uSun;
uniform float uFocal,uAspect,uNear,uFar;
out vec3 vColor;
out float vLight;
void main(){vec3 rel=aPosition-uCamera;float x=dot(rel,uRight),y=dot(rel,uUp),z=dot(rel,uForward);float A=(uFar+uNear)/(uFar-uNear),B=(-2.0*uFar*uNear)/(uFar-uNear);gl_Position=vec4(x*uFocal/uAspect,y*uFocal,A*z+B,z);vLight=clamp(.27+.84*dot(normalize(aPosition),normalize(uSun)),.17,1.12);vColor=aColor;}`;
const fs=`#version 300 es
precision highp float;
in vec3 vColor;in float vLight;out vec4 outColor;
void main(){outColor=vec4(vColor*vLight,1.0);}`;
function makeShader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'Shader compile failed');return s;}
const program=gl.createProgram();gl.attachShader(program,makeShader(gl.VERTEX_SHADER,vs));gl.attachShader(program,makeShader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'Shader link failed');gl.useProgram(program);
const vao=gl.createVertexArray(),vbo=gl.createBuffer(),ibo=gl.createBuffer();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
const U={};for(const n of ['uCamera','uRight','uUp','uForward','uSun','uFocal','uAspect','uNear','uFar'])U[n]=gl.getUniformLocation(program,n);

const RADIUS_KM=6371,HEIGHT_SCALE=.0022,TARGET_PIXELS=58,MAX_TILES=1250,GRID=2,GW=72,GH=36,COUNT=GW*GH,SAVE_KEY='reality-engine-v4-world-1';
const roots=[];for(let face=0;face<6;face++)roots.push({face,u0:-1,v0:-1,u1:1,v1:1,level:0});
const baseE=new Float32Array(COUNT),baseWet=new Float32Array(COUNT),temperature=new Float32Array(COUNT),slope=new Float32Array(COUNT),moisture=new Float32Array(COUNT),vegetation=new Float32Array(COUNT),runoff=new Float32Array(COUNT),population=new Float32Array(COUNT);
const nextMoisture=new Float32Array(COUNT),nextVegetation=new Float32Array(COUNT),nextRunoff=new Float32Array(COUNT),nextPopulation=new Float32Array(COUNT);
let worldYears=0,simAccumulator=0,lastSave=performance.now(),simSteps=0;
initWorld();loadWorld();

let lat=0,lon=0,heading=0,pitch=-.12,move=0,pointer=null,lastX=0,lastY=0,last=performance.now(),lastInteraction=performance.now();
let tileCount=0,indexCount=0,maxDrawLevel=0,currentAltitudeKm=12000,currentFlight=0;

function initWorld(){
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,la=(y+.5)/GH*Math.PI-Math.PI/2,lo=(x+.5)/GW*Math.PI*2-Math.PI,p=latLon(la,lo),q=baseTerrain(p);baseE[i]=q.e;baseWet[i]=q.wet;temperature[i]=q.temp;moisture[i]=q.e<0?1:clamp(q.wet*.72+.12,0,1);vegetation[i]=q.e<0?0:clamp((moisture[i]-.18)*1.5*(1-Math.abs(q.temp-.62)),0,1);runoff[i]=0;const h=habitability(i,moisture[i],vegetation[i]);population[i]=h>.67&&hash(i*19.31)>.987?80+hash(i*7.7)*520:0;}
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,e=baseE[i],l=baseE[y*GW+wrapX(x-1)],r=baseE[y*GW+wrapX(x+1)],u=baseE[Math.max(0,y-1)*GW+x],d=baseE[Math.min(GH-1,y+1)*GW+x];slope[i]=Math.max(Math.abs(e-l),Math.abs(e-r),Math.abs(e-u),Math.abs(e-d));}
}
function loadWorld(){try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!saved||saved.version!==1||saved.moisture?.length!==COUNT)return;worldYears=+saved.years||0;moisture.set(saved.moisture);vegetation.set(saved.vegetation);runoff.set(saved.runoff);population.set(saved.population);}catch(_){}}
function saveWorld(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,years:worldYears,moisture:Array.from(moisture),vegetation:Array.from(vegetation),runoff:Array.from(runoff),population:Array.from(population)}));lastSave=performance.now();}catch(_){}}
addEventListener('pagehide',saveWorld);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveWorld();});

function simulate(years){
 const dt=clamp(years/100,0,.9),epoch=Math.floor(worldYears/1200);
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
  const i=y*GW+x,e=baseE[i];if(e<0){nextMoisture[i]=1;nextVegetation[i]=0;nextRunoff[i]=0;nextPopulation[i]=0;continue;}
  const li=y*GW+wrapX(x-1),ri=y*GW+wrapX(x+1),ui=Math.max(0,y-1)*GW+x,di=Math.min(GH-1,y+1)*GW+x;
  const avgM=(moisture[li]+moisture[ri]+moisture[ui]+moisture[di])*.25,avgV=(vegetation[li]+vegetation[ri]+vegetation[ui]+vegetation[di])*.25,avgP=(population[li]+population[ri]+population[ui]+population[di])*.25;
  const oceanNeighbors=(baseE[li]<0?1:0)+(baseE[ri]<0?1:0)+(baseE[ui]<0?1:0)+(baseE[di]<0?1:0);
  const rain=clamp(.16+baseWet[i]*.7+oceanNeighbors*.045-e*.12+.05*Math.sin(epoch*.37+i*.011),0,1),evap=(.025+temperature[i]*.055)*(1-vegetation[i]*.28);
  const m=clamp(moisture[i]+((rain-evap)*.045+(avgM-moisture[i])*.12)*dt,0,1);
  const flow=clamp(Math.max(0,m-(.5+vegetation[i]*.14))*(.22+slope[i]*4.2),0,1);
  const targetV=temperature[i]<.12?0:clamp((m-.14)*1.55*(1-Math.abs(temperature[i]-.62)*1.2),0,1);
  const v=clamp(vegetation[i]+((targetV-vegetation[i])*.07+(avgV-vegetation[i])*.018)*dt,0,1);
  const h=habitability(i,m,v);let p=population[i];p+=p*(h-.43)*.006*dt+(avgP-p)*.0015*dt;if(p<1&&h>.74&&hash(i*13.7+epoch*5.1)>.9991)p=35+hash(i+epoch)*140;p=clamp(p,0,95000);
  nextMoisture[i]=m;nextRunoff[i]=flow;nextVegetation[i]=v;nextPopulation[i]=p;
 }
 moisture.set(nextMoisture);vegetation.set(nextVegetation);runoff.set(nextRunoff);population.set(nextPopulation);simSteps++;
}
function habitability(i,m,v){const t=temperature[i],e=baseE[i];if(e<=0||e>.48||t<.15||t>.92)return 0;return clamp((m-.16)*.9+v*.42-(Math.abs(t-.58)*.7)-slope[i]*.55,0,1);}

function resize(){const d=Math.min(devicePixelRatio||1,1.3),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{pointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;lastInteraction=performance.now();canvas.setPointerCapture?.(pointer);});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;const dx=e.clientX-lastX,dy=e.clientY-lastY,orbital=1-currentFlight;lon=wrap(lon-dx*.006*orbital);lat=clamp(lat+dy*.0045*orbital,-1.48,1.48);heading=wrap(heading+dx*.005*currentFlight);pitch=clamp(pitch-dy*.004*currentFlight,-.72,.62);lastX=e.clientX;lastY=e.clientY;lastInteraction=performance.now();});
const release=e=>{if(e.pointerId===pointer)pointer=null;};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();altitude.value=String(clamp(+altitude.value-e.deltaY*.0008,0,1));lastInteraction=performance.now();},{passive:false});
for(const [id,value] of [['forward',1],['back',-1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{move=value;b.setPointerCapture?.(e.pointerId);lastInteraction=performance.now();});b.addEventListener('pointerup',()=>move=0);b.addEventListener('pointercancel',()=>move=0);b.addEventListener('pointerleave',()=>move=0);}

function frame(now){requestAnimationFrame(frame);const dt=Math.min(.06,(now-last)/1000);last=now;resize();const a=+altitude.value;currentAltitudeKm=Math.max(.15,12000*Math.pow(1-a,2.35));currentFlight=1-smooth(30,350,currentAltitudeKm);if(pointer===null&&move===0&&currentFlight<.1&&now-lastInteraction>1600)lon=wrap(lon+dt*.025);if(move){const speed=Math.min(.04,.000035+currentAltitudeKm/RADIUS_KM*.028);advance(move*speed*dt);}const deltaYears=Math.pow(10,+timeSpeed.value)*dt;worldYears+=deltaYears;simAccumulator=Math.min(5000,simAccumulator+deltaYears);if(simAccumulator>=12){simulate(simAccumulator);simAccumulator=0;}render();updateUI();if(now-lastSave>12000)saveWorld();}

function render(){
 const up=latLon(lat,lon),east=normalize([-Math.sin(lon),0,Math.cos(lon)]),north=normalize(cross(up,east)),qHere=world(up),groundRadius=1+Math.max(0,qHere.e)*HEIGHT_SCALE,camRadius=groundRadius+currentAltitudeKm/RADIUS_KM,camera=scale(up,camRadius),tangent=normalize(add(scale(north,Math.cos(heading)),scale(east,Math.sin(heading)))),lowForward=normalize(add(scale(tangent,.96),scale(up,-.17+pitch*.7))),forward=normalize(mix(scale(up,-1),lowForward,currentFlight)),ref=normalize(mix(north,up,currentFlight));let right=normalize(cross(forward,ref));if(length(right)<.01)right=east;const camUp=normalize(cross(right,forward)),sky=skyColor(currentAltitudeKm);
 gl.clearColor(sky[0],sky[1],sky[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const fov=(52-currentFlight*8)*Math.PI/180,focal=1/Math.tan(fov/2),aspect=canvas.width/canvas.height,near=Math.max(.000005,currentAltitudeKm/RADIUS_KM*.025),far=5;
 gl.uniform3fv(U.uCamera,camera);gl.uniform3fv(U.uRight,right);gl.uniform3fv(U.uUp,camUp);gl.uniform3fv(U.uForward,forward);gl.uniform1f(U.uFocal,focal);gl.uniform1f(U.uAspect,aspect);gl.uniform1f(U.uNear,near);gl.uniform1f(U.uFar,far);gl.uniform3f(U.uSun,-.55,.72,.42);
 const selected=selectTiles(camera,up,focal*canvas.height*.5),mesh=buildMesh(selected);tileCount=selected.length;indexCount=mesh.indices.length;maxDrawLevel=mesh.maxLevel;gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mesh.vertices),gl.DYNAMIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(mesh.indices),gl.DYNAMIC_DRAW);gl.drawElements(gl.TRIANGLES,indexCount,gl.UNSIGNED_INT,0);
}
function selectTiles(camera,camUp,focalPx){const chosen=[],stack=roots.slice(),horizon=1/length(camera);while(stack.length&&chosen.length<MAX_TILES){const t=stack.pop(),center=faceSphere(t.face,(t.u0+t.u1)/2,(t.v0+t.v1)/2),corners=[faceSphere(t.face,t.u0,t.v0),faceSphere(t.face,t.u1,t.v0),faceSphere(t.face,t.u1,t.v1),faceSphere(t.face,t.u0,t.v1)];let maxDot=dot(center,camUp),edge=0;for(const p of corners){maxDot=Math.max(maxDot,dot(p,camUp));edge=Math.max(edge,distance(center,p));}if(maxDot<horizon-edge*.72)continue;const centerPos=scale(center,1+Math.max(0,world(center).e)*HEIGHT_SCALE),dist=Math.max(.00001,distance(camera,centerPos)),sizePx=edge*2/dist*focalPx,maxLevel=desiredMaxLevel(currentAltitudeKm);if(sizePx>TARGET_PIXELS&&t.level<maxLevel&&chosen.length+stack.length+4<MAX_TILES){const um=(t.u0+t.u1)/2,vm=(t.v0+t.v1)/2,l=t.level+1;stack.push({face:t.face,u0:t.u0,v0:t.v0,u1:um,v1:vm,level:l},{face:t.face,u0:um,v0:t.v0,u1:t.u1,v1:vm,level:l},{face:t.face,u0:um,v0:vm,u1:t.u1,v1:t.v1,level:l},{face:t.face,u0:t.u0,v0:vm,u1:um,v1:t.v1,level:l});}else chosen.push(t);}return chosen;}
function desiredMaxLevel(km){if(km>6000)return 5;if(km>1500)return 6;if(km>300)return 7;if(km>60)return 8;if(km>12)return 9;if(km>2)return 10;if(km>.4)return 11;return 12;}
function buildMesh(tiles){const vertices=[],indices=[];let base=0,maxLevel=0;for(const t of tiles){maxLevel=Math.max(maxLevel,t.level);for(let y=0;y<=GRID;y++){const v=lerp(t.v0,t.v1,y/GRID);for(let x=0;x<=GRID;x++){const u=lerp(t.u0,t.u1,x/GRID),dir=faceSphere(t.face,u,v),q=world(dir),radius=1+Math.max(0,q.e)*HEIGHT_SCALE,pos=scale(dir,radius),c=palette(q);vertices.push(pos[0],pos[1],pos[2],c[0],c[1],c[2]);}}for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const a=base+y*(GRID+1)+x,b=a+1,d=base+(y+1)*(GRID+1)+x,c=d+1;indices.push(a,d,b,b,d,c);}base+=(GRID+1)*(GRID+1);}return{vertices,indices,maxLevel};}

function faceSphere(face,u,v){let p;switch(face){case 0:p=[1,v,-u];break;case 1:p=[-1,v,u];break;case 2:p=[u,1,-v];break;case 3:p=[u,-1,v];break;case 4:p=[u,v,1];break;default:p=[-u,v,-1];}return normalize(p);}
function baseTerrain(p){const X=p[0],Y=p[1],Z=p[2],continent=Math.sin(X*3.1+Z*1.7)+Math.sin(Y*4.7-X*2.2)*.7,ridge=Math.abs(Math.sin(X*11+Y*8-Z*9)),detail=Math.sin((X+Z)*31+Y*17)*.08+Math.sin(X*67-Y*41+Z*53)*.025,e=clamp(continent*.18+Math.pow(ridge,2.3)*.28+detail-.06,-.35,.65),temp=1-Math.abs(Y),wet=clamp(.5+.3*Math.sin(Z*7-X*3)+.15*Math.sin(Y*13),0,1);return{e,temp,wet};}
function world(p){const q=baseTerrain(p),s=sampleState(p);return{e:q.e,temp:s.temp,wet:s.moisture,veg:s.vegetation,flow:s.runoff,pop:s.population};}
function sampleState(p){const la=Math.asin(clamp(p[1],-1,1)),lo=Math.atan2(p[2],p[0]),gx=(lo+Math.PI)/(Math.PI*2)*GW,gy=(la+Math.PI/2)/Math.PI*(GH-1),x0=Math.floor(gx),y0=Math.floor(gy),fx=gx-x0,fy=gy-y0,xA=wrapX(x0),xB=wrapX(x0+1),yA=clamp(y0,0,GH-1),yB=clamp(y0+1,0,GH-1),i00=yA*GW+xA,i10=yA*GW+xB,i01=yB*GW+xA,i11=yB*GW+xB;const m=f=>f[i00]*(1-fx)*(1-fy)+f[i10]*fx*(1-fy)+f[i01]*(1-fx)*fy+f[i11]*fx*fy;return{temp:m(temperature),moisture:m(moisture),vegetation:m(vegetation),runoff:m(runoff),population:m(population)};}
function palette(q){if(q.e<0)return[.035,.24+.07*q.wet,.43+.08*q.wet];if(q.flow>.32&&q.e<.34)return[.035,.38,.62];if(q.pop>650)return[.72,.49,.16];if(q.temp<.18||q.e>.48)return[.83,.88,.91];if(q.wet<.24)return[.64,.46,.21];const green=.18+.34*q.veg;return[.12+.16*(1-q.veg),green,.12+.08*q.wet];}
function skyColor(km){const t=1-smooth(55,180,km);return[mixScalar(.008,.23,t),mixScalar(.018,.49,t),mixScalar(.035,.69,t)];}
function advance(angle){const up=latLon(lat,lon),east=normalize([-Math.sin(lon),0,Math.cos(lon)]),north=normalize(cross(up,east)),dir=normalize(add(scale(north,Math.cos(heading)),scale(east,Math.sin(heading)))),next=normalize(add(scale(up,Math.cos(angle)),scale(dir,Math.sin(angle))));lat=Math.asin(clamp(next[1],-1,1));lon=Math.atan2(next[2],next[0]);}
function updateUI(){const q=world(latLon(lat,lon)),settlements=countSettlements(),forest=forestCover();altText.value=currentAltitudeKm>=1?Math.round(currentAltitudeKm).toLocaleString()+' km':Math.round(currentAltitudeKm*1000)+' m';badge.textContent='ENGINE V4 · LIVING SPHERE';mode.textContent=currentAltitudeKm>350?'Orbital camera':currentAltitudeKm>30?'Atmospheric flight':'Surface flight';coords.textContent=(lat*180/Math.PI).toFixed(1)+'°, '+(lon*180/Math.PI).toFixed(1)+'°';region.textContent=`temp ${Math.round(q.temp*42-12)}°C · moisture ${Math.round(q.wet*100)}% · vegetation ${Math.round(q.veg*100)}% · runoff ${Math.round(q.flow*100)}% · population ${Math.round(q.pop).toLocaleString()}`;year.value=worldYears<1e3?Math.floor(worldYears)+' yr':worldYears<1e6?(worldYears/1e3).toFixed(1)+' kyr':(worldYears/1e6).toFixed(2)+' Myr';stats.innerHTML='LOD '+maxDrawLevel+'<br>'+tileCount+' tiles<br>'+COUNT.toLocaleString()+' sim cells<br>'+settlements+' settlements<br>'+forest+'% forest';}
function countSettlements(){let n=0;for(let i=0;i<COUNT;i++)if(population[i]>40)n++;return n;}function forestCover(){let land=0,sum=0;for(let i=0;i<COUNT;i++)if(baseE[i]>0){land++;sum+=vegetation[i];}return land?Math.round(sum/land*100):0;}

function wrapX(x){x%=GW;if(x<0)x+=GW;return x;}function hash(n){return Math.abs(Math.sin(n*12.9898+78.233)*43758.5453)%1;}function latLon(la,lo){const c=Math.cos(la);return[c*Math.cos(lo),Math.sin(la),c*Math.sin(lo)];}function add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]];}function scale(a,s){return[a[0]*s,a[1]*s,a[2]*s];}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}function length(a){return Math.hypot(a[0],a[1],a[2]);}function normalize(a){const l=length(a)||1;return[a[0]/l,a[1]/l,a[2]/l];}function distance(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}function mix(a,b,t){return[a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t,a[2]*(1-t)+b[2]*t];}function lerp(a,b,t){return a+(b-a)*t;}function mixScalar(a,b,t){return a+(b-a)*t;}function clamp(v,a,b){return Math.max(a,Math.min(b,v));}function smooth(a,b,v){v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v);}function wrap(v){while(v>Math.PI)v-=Math.PI*2;while(v<-Math.PI)v+=Math.PI*2;return v;}
loading.remove();requestAnimationFrame(frame);
