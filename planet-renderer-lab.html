<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050b12"><title>Reality Sandbox — Planet</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{position:fixed;inset:0;background:#050b12}canvas{display:block;width:100%;height:100%;background:#050b12;touch-action:none}.debug-button{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(150,190,220,.28);background:rgba(8,18,28,.38);backdrop-filter:blur(10px);color:rgba(225,240,250,.72);font-size:0}.debug-button::before{content:'⌗';font-size:19px}.debug-button:active{transform:scale(.95)}.hidden-controls{display:none}</style></head><body><main><canvas id="planet" width="720" height="620" aria-label="Living simulated planet"></canvas></main><button id="debug" class="debug-button" aria-label="Toggle hex grid">Show hex grid</button><div class="hidden-controls" aria-hidden="true"><input id="zoom" type="range" min="0" max="1" step="0.01" value="0.56"><input id="relief" type="range" min="0" max="2" step="0.05" value="1"><input id="speed" type="range" min="0" max="5" step="1" value="2"><span id="lod"></span><span id="faces"></span><span id="age"></span><span id="rivers"></span><span id="cities"></span><span id="forest"></span><span id="snow"></span><span id="desert"></span><span id="hexes"></span><span id="nodes"></span></div><script type="module" src="./planet-renderer-lab.js?v=2"></script></body></html>
