<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Engine v2.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#def3ff;font-family:system-ui,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.pill,.hud,.stats,.move button{background:#07131dcc;border:1px solid #91bdd033;backdrop-filter:blur(10px)}.pill{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:7px 10px;border-radius:999px;font-size:11px}.stats{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;padding:8px 10px;border-radius:12px;font:10px ui-monospace,monospace;line-height:1.5;color:#b9d7e8}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px}.top{display:flex;justify-content:space-between;font-size:11px}.row{display:grid;grid-template-columns:60px 1fr 75px;gap:8px;align-items:center;margin-top:7px}.row label,.row output{font-size:10px;color:#abc7d8}.row input{width:100%;accent-color:#8fd0ff}.move{position:fixed;right:14px;bottom:125px;display:grid;grid-template-columns:46px 46px;gap:8px}.move button{height:46px;border-radius:14px;color:#effaff;font-size:19px}.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#07131dee;font-size:13px}</style></head><body><canvas id="c"></canvas><div id="load" class="loading">Rebuilding terrain mesh…</div><div id="pill" class="pill">ENGINE V2.1 · ORBIT</div><div id="stats" class="stats">LOD 0<br>0 cached<br>0 active</div><div class="move"><button id="f">▲</button><button id="b">▼</button></div><section class="hud"><div class="top"><span id="mode">Orbit</span><span id="coords">0.0°, 0.0°</span></div><div class="row"><label>ALTITUDE</label><input id="alt" type="range" min="0" max="1" step=".001" value="0"><output id="altOut">12,000 km</output></div><div class="row"><label>TIME</label><input id="time" type="range" min="0" max="6" step=".01" value="2.2"><output id="year">0 yr</output></div></section><script>(()=>{'use strict';const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),alt=document.querySelector('#alt'),altOut=document.querySelector('#altOut'),pill=document.querySelector('#pill'),stats=document.querySelector('#stats'),mode=document.querySelector('#mode'),coords=document.querySelector('#coords'),time=document.querySelector('#time'),year=document.querySelector('#year');if(!g)return;let W=0,H=0,img,zbuf;function resize(){const d=Math.min(devicePixelRatio||1,1.08);W=c.width=Math.floor(innerWidth*d);H=c.height=Math.floor(innerHeight*d);img=g.createImageData(W,H);zbuf=new Float32Array(W*H)}resize();addEventListener('resize',resize);const N=12000,P=new Float32Array(N*3),gold=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const y=1-(i+.5)*2/N,r=Math.sqrt(Math.max(0,1-y*y)),a=i*gold;P[i*3]=Math.cos(a)*r;P[i*3+1]=y;P[i*3+2]=Math.sin(a)*r}const cache=new Map(),active=new Set(),tileSizes=[.12,.09,.065,.045,.03,.02,.013],tileN=8;let yaw=.4,pitch=-.1,lat=0,lon=0,heading=0,move=0,pid=null,lx=0,ly=0,years=0,last=performance.now();for(const [id,v] of [['f',1],['b',-1]]){const e=document.querySelector('#'+id);e.onpointerdown=q=>{move=v;e.setPointerCapture?.(q.pointerId)};e.onpointerup=e.onpointercancel=e.onpointerleave=()=>move=0}c.onpointerdown=e=>{pid=e.pointerId;lx=e.clientX;ly=e.clientY;c.setPointerCapture?.(pid)};c.onpointermove=e=>{if(e.pointerId!==pid)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(+alt.value<.77){yaw+=dx*.008;pitch=clamp(pitch+dy*.008,-1.3,1.3)}else{heading+=dx*.004;pitch=clamp(pitch+dy*.004,-.55,.55)}lx=e.clientX;ly=e.clientY};c.onpointerup=c.onpointercancel=e=>{if(e.pointerId===pid)pid=null};c.addEventListener('wheel',e=>{e.preventDefault();alt.value=clamp(+alt.value-e.deltaY*.0008,0,1)},{passive:false});document.querySelector('#load').remove();requestAnimationFrame(frame);function frame(t){requestAnimationFrame(frame);const dt=Math.min(.06,(t-last)/1000);last=t;const a=+alt.value,s=smooth(.90,.992,a),lod=Math.min(6,Math.floor(a*7));if(s>.02){lat=clamp(lat+Math.cos(heading)*move*dt*.045,-1.49,1.49);lon=wrap(lon+Math.sin(heading)*move*dt*.045/Math.max(.18,Math.cos(lat)))}else if(pid===null)yaw+=dt*.018;years+=Math.pow(10,+time.value)*dt;active.clear();draw(a,s,lod);trimCache();const km=Math.round(12000*Math.pow(1-a,2.35));altOut.value=km>1?km.toLocaleString()+' km':Math.round(km*1000)+' m';const stage=s>.72?'SURFACE':a>.53?'ATMOSPHERE':'ORBIT';pill.textContent='ENGINE V2.1 · '+stage;mode.textContent=s>.72?'Connected terrain flight':a>.53?'Atmospheric descent':'Planet overview';coords.textContent=(lat*180/Math.PI).toFixed(1)+'°, '+(lon*180/Math.PI).toFixed(1)+'°';year.value=years<1e3?Math.floor(years)+' yr':years<1e6?(years/1e3).toFixed(1)+' kyr':(years/1e6).toFixed(2)+' Myr';stats.innerHTML='LOD '+lod+'<br>'+cache.size+' cached<br>'+active.size+' active'}function draw(a,s,lod){if(s<.985)drawGlobe(a);if(s>0){g.globalAlpha=s;drawSurface(s,lod);g.globalAlpha=1}}function drawGlobe(a){const D=img.data;D.fill(0);zbuf.fill(-1e9);const scale=Math.min(W,H)*(.22+a*.7),cx=W/2,cy=H/2,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,a>.53?'#153f62':'#02060b');sky.addColorStop(1,a>.53?'#75b4d7':'#02060b');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#08263a';g.beginPath();g.arc(cx,cy,scale,0,Math.PI*2);g.fill();for(let i=0;i<N;i++){const X=P[i*3],Y=P[i*3+1],Z=P[i*3+2],q=worldSample(Math.asin(Y),Math.atan2(Z,X));let xx=X*ca-Z*sa,zz=X*sa+Z*ca,yy=Y*cp-zz*sp;zz=Y*sp+zz*cp;const R=1+q.e*.075;xx*=R;yy*=R;zz*=R;if(zz<=0)continue;const px=Math.round(cx+xx*scale),py=Math.round(cy-yy*scale);if(px<0||py<0||px>=W||py>=H)continue;const di=py*W+px;if(zz<=zbuf[di])continue;zbuf[di]=zz;const k=di*4,C=palette(q),L=clamp(.22+zz*.95+yy*.08,.18,1.2);D[k]=C[0]*L;D[k+1]=C[1]*L;D[k+2]=C[2]*L;D[k+3]=255}g.putImageData(img,0,0);const rim=g.createRadialGradient(cx,cy,scale*.82,cx,cy,scale*1.09);rim.addColorStop(.78,'#4bb8ff00');rim.addColorStop(1,'#63c7ff55');g.fillStyle=rim;g.beginPath();g.arc(cx,cy,scale*1.09,0,Math.PI*2);g.fill()}function drawSurface(s,lod){const horizon=H*(.39+pitch*.2),sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4c91bc');sky.addColorStop(1,'#c7e2ef');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#4f8795';g.fillRect(0,horizon,W,H-horizon);const cols=lod<3?42:lod<5?54:66,rows=lod<3?34:lod<5?44:54,range=lod<3?3.4:lod<5?2.7:2.2,pts=new Array((cols+1)*(rows+1));for(let r=0;r<=rows;r++){const t=r/rows,z=.035+Math.pow(t,1.55)*range,baseY=horizon+(H-horizon)*(1-Math.exp(-z*1.8));for(let j=0;j<=cols;j++){const nx=j/cols*2-1,east=nx*(.16+z*.78),north=z,la=clamp(lat+(north*Math.cos(heading)-east*Math.sin(heading))*.018,-1.55,1.55),lo=wrap(lon+(north*Math.sin(heading)+east*Math.cos(heading))*.018/Math.max(.2,Math.cos(lat))),q=sampleTile(la,lo,lod),height=Math.max(0,q.e),sx=W/2+nx*W*.61,sy=baseY-height*(70+s*170)/(z+.2);pts[r*(cols+1)+j]={sx,sy,q,z}}}for(let r=rows-1;r>=0;r--){for(let j=0;j<cols;j++){const a=pts[r*(cols+1)+j],b=pts[r*(cols+1)+j+1],d=pts[(r+1)*(cols+1)+j],cc=pts[(r+1)*(cols+1)+j+1],avg={e:(a.q.e+b.q.e+cc.q.e+d.q.e)/4,temp:(a.q.temp+b.q.temp+cc.q.temp+d.q.temp)/4,wet:(a.q.wet+b.q.wet+cc.q.wet+d.q.wet)/4},C=palette(avg),fog=clamp((a.z-1.15)/2.5,0,.68),shade=.48+.44*(1-r/rows),R=C[0]*shade*(1-fog)+126*fog,G=C[1]*shade*(1-fog)+166*fog,Bb=C[2]*shade*(1-fog)+181*fog;g.beginPath();g.moveTo(a.sx,a.sy);g.lineTo(b.sx,b.sy);g.lineTo(cc.sx,cc.sy);g.lineTo(d.sx,d.sy);g.closePath();g.fillStyle=`rgb(${R|0},${G|0},${Bb|0})`;g.fill()}}if(lod>=5){g.strokeStyle='#d7f2ff13';g.lineWidth=1;for(let j=0;j<=cols;j+=8){g.beginPath();for(let r=0;r<=rows;r++){const p=pts[r*(cols+1)+j];r?g.lineTo(p.sx,p.sy):g.moveTo(p.sx,p.sy)}g.stroke()}}}function sampleTile(la,lo,lod){const size=tileSizes[lod],tx=Math.floor((lo+Math.PI)/size),ty=Math.floor((la+Math.PI/2)/size),key=lod+':'+tx+':'+ty;let tile=cache.get(key);if(!tile){const arr=new Array((tileN+1)*(tileN+1)),baseLo=tx*size-Math.PI,baseLa=ty*size-Math.PI/2;for(let y=0;y<=tileN;y++)for(let x=0;x<=tileN;x++)arr[y*(tileN+1)+x]=worldSample(clamp(baseLa+y/tileN*size,-Math.PI/2,Math.PI/2),wrap(baseLo+x/tileN*size));tile={arr,baseLa,baseLo,size,last:performance.now()};cache.set(key,tile)}tile.last=performance.now();active.add(key);const u=clamp((unwrapNear(lo,tile.baseLo)-tile.baseLo)/tile.size,0,.999999)*tileN,v=clamp((la-tile.baseLa)/tile.size,0,.999999)*tileN,x0=Math.floor(u),y0=Math.floor(v),fx=u-x0,fy=v-y0,i=y0*(tileN+1)+x0,q00=tile.arr[i],q10=tile.arr[i+1],q01=tile.arr[i+tileN+1],q11=tile.arr[i+tileN+2];return mixQ(q00,q10,q01,q11,fx,fy)}function mixQ(a,b,c,d,x,y){const m=(k)=>a[k]*(1-x)*(1-y)+b[k]*x*(1-y)+c[k]*(1-x)*y+d[k]*x*y;return{e:m('e'),temp:m('temp'),wet:m('wet')}}function trimCache(){if(cache.size<=120)return;const entries=[...cache.entries()].sort((a,b)=>a[1].last-b[1].last);for(let i=0;i<entries.length-120;i++)cache.delete(entries[i][0])}function worldSample(la,lo){const X=Math.cos(la)*Math.cos(lo),Y=Math.sin(la),Z=Math.cos(la)*Math.sin(lo),c=Math.sin(X*3.1+Z*1.7)+Math.sin(Y*4.7-X*2.2)*.7,r=Math.abs(Math.sin(X*11+Y*8-Z*9)),d=Math.sin((X+Z)*31+Y*17)*.08,e=clamp(c*.18+Math.pow(r,2.3)*.28+d-.06,-.35,.65),temp=1-Math.abs(Y),wet=clamp(.5+.3*Math.sin(Z*7-X*3)+.15*Math.sin(Y*13),0,1);return{e,temp,wet}}function palette(q){if(q.e<0)return[13,72,116];if(q.temp<.2||q.e>.48)return[226,235,239];if(q.wet<.28)return[171,132,67];if(q.wet>.72)return[34,116,65];return[58,132,68]}function unwrapNear(v,base){while(v<base)v+=Math.PI*2;while(v>=base+Math.PI*2)v-=Math.PI*2;return v}function wrap(v){while(v>Math.PI)v-=Math.PI*2;while(v<-Math.PI)v+=Math.PI*2;return v}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function smooth(a,b,v){v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)}})();</script></body></html>
