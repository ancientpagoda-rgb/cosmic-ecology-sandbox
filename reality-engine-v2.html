<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Engine v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#def3ff;font-family:system-ui,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.pill,.hud,.stats,.move button{background:#07131dcc;border:1px solid #91bdd033;backdrop-filter:blur(10px)}.pill{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:7px 10px;border-radius:999px;font-size:11px}.stats{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;padding:8px 10px;border-radius:12px;font:10px ui-monospace,monospace;line-height:1.5;color:#b9d7e8}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px}.top{display:flex;justify-content:space-between;font-size:11px}.row{display:grid;grid-template-columns:60px 1fr 75px;gap:8px;align-items:center;margin-top:7px}.row label,.row output{font-size:10px;color:#abc7d8}.row input{width:100%;accent-color:#8fd0ff}.move{position:fixed;right:14px;bottom:125px;display:grid;grid-template-columns:46px 46px;gap:8px}.move button{height:46px;border-radius:14px;color:#effaff;font-size:19px}.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#07131dee;font-size:13px}</style></head><body><canvas id="c"></canvas><div id="load" class="loading">Building adaptive world…</div><div id="pill" class="pill">ENGINE V2 · ORBIT</div><div id="stats" class="stats">LOD 0<br>0 chunks</div><div class="move"><button id="f">▲</button><button id="b">▼</button></div><section class="hud"><div class="top"><span id="mode">Orbit</span><span id="coords">0.0°, 0.0°</span></div><div class="row"><label>ALTITUDE</label><input id="alt" type="range" min="0" max="1" step=".001" value="0"><output id="altOut">12,000 km</output></div><div class="row"><label>TIME</label><input id="time" type="range" min="0" max="6" step=".01" value="2.2"><output id="year">0 yr</output></div></section><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),alt=document.querySelector('#alt'),altOut=document.querySelector('#altOut'),pill=document.querySelector('#pill'),stats=document.querySelector('#stats'),mode=document.querySelector('#mode'),coords=document.querySelector('#coords'),time=document.querySelector('#time'),year=document.querySelector('#year');if(!g)return;let W,H,dpr,img,zbuf;function resize(){dpr=Math.min(devicePixelRatio||1,1.1);W=c.width=Math.floor(innerWidth*dpr);H=c.height=Math.floor(innerHeight*dpr);img=g.createImageData(W,H);zbuf=new Float32Array(W*H)}resize();addEventListener('resize',resize);const N=14000,P=new Float32Array(N*3),ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const y=1-(i+.5)*2/N,r=Math.sqrt(1-y*y),a=i*ga;P[i*3]=Math.cos(a)*r;P[i*3+1]=y;P[i*3+2]=Math.sin(a)*r}const cache=new Map();let yaw=.4,pitch=-.1,lat=0,lon=0,heading=0,move=0,pid=null,lx=0,ly=0,years=0,last=performance.now();for(const [id,v] of [['f',1],['b',-1]]){const e=document.querySelector('#'+id);e.onpointerdown=q=>{move=v;e.setPointerCapture?.(q.pointerId)};e.onpointerup=e.onpointercancel=()=>move=0}c.onpointerdown=e=>{pid=e.pointerId;lx=e.clientX;ly=e.clientY;c.setPointerCapture?.(pid)};c.onpointermove=e=>{if(e.pointerId!==pid)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(+alt.value<.77){yaw+=dx*.008;pitch=clamp(pitch+dy*.008,-1.3,1.3)}else{heading+=dx*.004;pitch=clamp(pitch+dy*.004,-.55,.55)}lx=e.clientX;ly=e.clientY};c.onpointerup=c.onpointercancel=e=>{if(e.pointerId===pid)pid=null};c.addEventListener('wheel',e=>{e.preventDefault();alt.value=clamp(+alt.value-e.deltaY*.0008,0,1)},{passive:false});document.querySelector('#load').remove();requestAnimationFrame(frame);function frame(t){requestAnimationFrame(frame);const dt=Math.min(.06,(t-last)/1000);last=t;const a=+alt.value,s=smooth(.68,.95,a),lod=Math.floor(a*7);if(s>.02){lat=clamp(lat+Math.cos(heading)*move*dt*.055,-1.49,1.49);lon+=Math.sin(heading)*move*dt*.055/Math.max(.18,Math.cos(lat))}else if(pid===null)yaw+=dt*.018;years+=Math.pow(10,+time.value)*dt;draw(a,s,lod);const km=Math.round(12000*Math.pow(1-a,2.35));altOut.value=km>1?km.toLocaleString()+' km':Math.round(km*1000)+' m';const stage=s>.78?'SURFACE':a>.53?'ATMOSPHERE':'ORBIT';pill.textContent='ENGINE V2 · '+stage;mode.textContent=s>.78?'Adaptive chunk flight':a>.53?'Streaming descent':'Planet overview';coords.textContent=(lat*180/Math.PI).toFixed(1)+'°, '+(lon*180/Math.PI).toFixed(1)+'°';year.value=years<1e3?Math.floor(years)+' yr':years<1e6?(years/1e3).toFixed(1)+' kyr':(years/1e6).toFixed(2)+' Myr';stats.innerHTML='LOD '+lod+'<br>'+cache.size+' cached<br>'+activeChunks(lod)+' active'}function draw(a,s,lod){drawGlobe(a);if(s>0){g.globalAlpha=s;drawChunks(s,lod);g.globalAlpha=1}}function drawGlobe(a){const D=img.data;D.fill(0);zbuf.fill(-1e9);const scale=Math.min(W,H)*(.22+a*.7),cx=W/2,cy=H/2,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,a>.53?'#153f62':'#02060b');sky.addColorStop(1,a>.53?'#75b4d7':'#02060b');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#08263a';g.beginPath();g.arc(cx,cy,scale,0,Math.PI*2);g.fill();for(let i=0;i<N;i++){const X=P[i*3],Y=P[i*3+1],Z=P[i*3+2],q=sample(Math.asin(Y),Math.atan2(Z,X));let xx=X*ca-Z*sa,zz=X*sa+Z*ca,yy=Y*cp-zz*sp;zz=Y*sp+zz*cp;const R=1+q.e*.075;xx*=R;yy*=R;zz*=R;if(zz<=0)continue;const px=Math.round(cx+xx*scale),py=Math.round(cy-yy*scale);if(px<0||py<0||px>=W||py>=H)continue;const di=py*W+px;if(zz<=zbuf[di])continue;zbuf[di]=zz;const k=di*4,C=color(q),L=clamp(.22+zz*.95+yy*.08,.18,1.2);D[k]=C[0]*L;D[k+1]=C[1]*L;D[k+2]=C[2]*L;D[k+3]=255}g.putImageData(img,0,0);const rim=g.createRadialGradient(cx,cy,scale*.82,cx,cy,scale*1.09);rim.addColorStop(.78,'#4bb8ff00');rim.addColorStop(1,'#63c7ff55');g.fillStyle=rim;g.beginPath();g.arc(cx,cy,scale*1.09,0,Math.PI*2);g.fill()}function activeChunks(lod){return lod<3?6:lod<5?12:20}function getChunk(cx,cz,lod){const key=lod+':'+cx+':'+cz;if(cache.has(key))return cache.get(key);const n=lod<4?5:lod<6?7:9,arr=[];for(let z=0;z<=n;z++)for(let x=0;x<=n;x++){const east=cx+(x/n-.5),north=cz+z/n,la=clamp(lat+(north*Math.cos(heading)-east*Math.sin(heading))*.018,-1.55,1.55),lo=lon+(north*Math.sin(heading)+east*Math.cos(heading))*.018/Math.max(.2,Math.cos(lat));arr.push(sample(la,lo))}const out={n,arr};cache.set(key,out);if(cache.size>80)cache.delete(cache.keys().next().value);return out}function drawChunks(s,lod){const horizon=H*(.42+pitch*.2),sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4d92bd');sky.addColorStop(1,'#c6e1ef');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#315c68';g.fillRect(0,horizon,W,H-horizon);const size=lod<3?.7:lod<5?.42:.26,rows=Math.ceil(2.8/size),cols=5;for(let rz=rows;rz>=0;rz--)for(let cx=-2;cx<=2;cx++){const z0=.03+rz*size,x0=cx*size,ch=getChunk(x0,z0,lod),n=ch.n;for(let iz=n-1;iz>=0;iz--){const za=z0+iz/n*size,zb=z0+(iz+1)/n*size,ya=horizon+(H-horizon)*(1-Math.exp(-za*2.05)),yb=horizon+(H-horizon)*(1-Math.exp(-zb*2.05));g.beginPath();let C;for(let ix=0;ix<=n;ix++){const q=ch.arr[iz*(n+1)+ix];C=C||color(q);const east=x0+(ix/n-.5)*size,sx=W/2+east/(za+.2)*W*.32,sy=ya-q.e*(85+s*190)/(za+.15);ix?g.lineTo(sx,sy):g.moveTo(sx,sy)}g.lineTo(W/2+(x0+size*.5)/(zb+.2)*W*.32,yb+80);g.lineTo(W/2+(x0-size*.5)/(zb+.2)*W*.32,yb+80);g.closePath();const shade=.45+.5*Math.min(1,za/2.8);g.fillStyle=`rgb(${C[0]*shade},${C[1]*shade},${C[2]*shade})`;g.fill();if(lod>4){g.strokeStyle='#b9e8ff18';g.lineWidth=1;g.stroke()}}}}function sample(la,lo){const X=Math.cos(la)*Math.cos(lo),Y=Math.sin(la),Z=Math.cos(la)*Math.sin(lo),c=Math.sin(X*3.1+Z*1.7)+Math.sin(Y*4.7-X*2.2)*.7,r=Math.abs(Math.sin(X*11+Y*8-Z*9)),d=Math.sin((X+Z)*31+Y*17)*.08,e=clamp(c*.18+Math.pow(r,2.3)*.28+d-.06,-.35,.65),temp=1-Math.abs(Y),wet=clamp(.5+.3*Math.sin(Z*7-X*3)+.15*Math.sin(Y*13),0,1);return{e,temp,wet}}function color(q){if(q.e<0)return[13,72,116];if(q.temp<.2||q.e>.48)return[226,235,239];if(q.wet<.28)return[171,132,67];if(q.wet>.72)return[34,116,65];return[58,132,68]}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function smooth(a,b,v){v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)}})();</script></body></html>
