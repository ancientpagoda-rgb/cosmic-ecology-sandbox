<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Reality Engine V6 · Living Cesium World</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.143.0/Build/Cesium/';</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.143.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.143.0/Build/Cesium/Cesium.js"></script>
<style>
*{box-sizing:border-box}html,body,#cesium{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;color:#def3ff;font-family:system-ui,-apple-system,sans-serif}.glass{background:#07131dde;border:1px solid #91bdd03d;backdrop-filter:blur(11px)}.badge{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;padding:8px 11px;border-radius:999px;font-size:11px}.stats{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));right:12px;padding:9px 11px;border-radius:12px;font:10px/1.48 ui-monospace,SFMono-Regular,monospace;color:#bad9eb;text-align:right}.hud{position:fixed;z-index:5;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border-radius:14px}.top{display:flex;justify-content:space-between;gap:10px;font-size:11px}.inspect{margin-top:6px;font:10px/1.35 ui-monospace,SFMono-Regular,monospace;color:#9fc5da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.speed{display:grid;grid-template-columns:46px 1fr 88px;gap:8px;align-items:center;margin-top:8px}.speed label,.speed output{font-size:10px;color:#abc8d9}.speed input{width:100%;accent-color:#8fd0ff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.actions button,.actions a{padding:8px 5px;border-radius:10px;border:1px solid #91bdd03d;background:#0b1c28;color:#dff4ff;text-align:center;text-decoration:none;font:10px system-ui}.loading{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:13px;font-size:13px}.cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
</style>
</head>
<body>
<div id="cesium"></div>
<div id="loading" class="loading glass">Loading persistent rivers and civilizations…</div>
<div class="badge glass">ENGINE V6 · LIVING CESIUM WORLD</div>
<div id="stats" class="stats glass">Starting simulation…</div>
<section class="hud glass">
  <div class="top"><span id="age">0 yr</span><span id="coords">0.0°, 0.0°</span></div>
  <div id="inspect" class="inspect">Tap terrain to inspect its persistent simulation state.</div>
  <div class="speed"><label>SPEED</label><input id="speed" type="range" min="0" max="5" step="1" value="0"><output id="speedOut">paused</output></div>
  <div class="actions">
    <button id="step100" type="button">+100 years</button>
    <button id="step1000" type="button">+1,000 years</button>
    <button id="save" type="button">Save world</button>
    <button id="resetCamera" type="button">Reset camera</button>
    <button id="resetWorld" type="button">Reset world</button>
    <a href="./reality-engine-v5.html">Open V5</a>
  </div>
</section>
<script type="module" src="./core/reality-v6/app.js"></script>
</body>
</html>
