<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Sandbox Stable</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;padding:10px 12px;border:1px solid rgba(145,185,215,.18);border-radius:14px;background:rgba(5,12,20,.5);backdrop-filter:blur(12px)}.top{display:flex;justify-content:space-between;color:#dbeeff;font-size:.78rem;margin-bottom:7px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.row label,.row output{font-size:.7rem;color:#b9d6e9}input{width:100%;accent-color:#8fc6ff}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;color:#cfe8fa;background:rgba(5,12,20,.8);padding:10px 14px;border-radius:12px;font-size:.85rem}</style></head><body><div id="app"></div><div id="status" class="status">Starting inline runtime…</div><section class="hud"><div class="top"><span id="year">0 years</span><span>drag · pinch · scroll</span></div><div class="row"><label>TIME</label><input id="timeSpeed" type="range" min="0" max="6" step="0.01" value="2.6"><output id="speedLabel">398 yr/s</output></div></section><script>
(function(){
const app=document.getElementById('app'),status=document.getElementById('status'),yearEl=document.getElementById('year'),speed=document.getElementById('timeSpeed'),speedLabel=document.getElementById('speedLabel');
try{
const c=document.createElement('canvas'),x=c.getContext('2d',{alpha:false});if(!x)throw Error('Canvas unavailable');app.appendChild(c);
const N=18000,p=new Float32Array(N*3),e=new Float32Array(N),m=new Float32Array(N),t=new Float32Array(N),f=new Float32Array(N),r=new Float32Array(N),city=new Float32Array(N),cloud=new Uint8Array(N),g=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){const y=1-i/(N-1)*2,q=Math.sqrt(Math.max(0,1-y*y)),a=g*i,X=Math.cos(a)*q,Z=Math.sin(a)*q;p[i*3]=X;p[i*3+1]=y;p[i*3+2]=Z;const E=clamp(.5+Math.sin(X*5.1+Z*2.2)*.17+Math.sin(y*7.3-X*3.4)*.13+Math.abs(Math.sin(X*14+y*9-Z*11))*.18,0,1);e[i]=E;t[i]=clamp(.9-Math.abs(y)*.8-Math.max(0,E-.62)*.7,0,1);m[i]=clamp(.48+Math.sin(Z*6.2-X*2.6)*.24+Math.sin(y*10.7+Z*4.1)*.16,0,1);f[i]=clamp(m[i]*t[i]*1.5-.2,0,1);r[i]=clamp((1-Math.abs(Math.sin(X*22+y*13-Z*17)))*m[i]*Math.max(0,E-.44)*2.8,0,1);city[i]=E>.48&&E<.66&&r[i]>.76&&m[i]>.52&&hash(i)>.996?.25:0;cloud[i]=Math.sin(X*13+y*7-Z*9)+Math.sin(X*5-y*11+Z*4)>.8?1:0}
let yaw=.45,pitch=-.1,zoom=.56,years=0,last=performance.now(),pointer=null,lx=0,ly=0;const touches=new Map();let ps=0,zs=zoom,img,depth;
function resize(){const d=Math.min(devicePixelRatio||1,1.1),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;img=x.createImageData(w,h);depth=new Float32Array(w*h)}}resize();addEventListener('resize',resize);
c.addEventListener('pointerdown',v=>{touches.set(v.pointerId,[v.clientX,v.clientY]);if(touches.size===1){pointer=v.pointerId;lx=v.clientX;ly=v.clientY}else{pointer=null;ps=dist();zs=zoom}c.setPointerCapture?.(v.pointerId)});
c.addEventListener('pointermove',v=>{if(!touches.has(v.pointerId))return;touches.set(v.pointerId,[v.clientX,v.clientY]);if(touches.size>=2){zoom=clamp(zs+(dist()-ps)/250,0,1);return}if(v.pointerId!==pointer)return;yaw+=(v.clientX-lx)*.009;pitch=clamp(pitch+(v.clientY-ly)*.009,-1.35,1.35);lx=v.clientX;ly=v.clientY});
function release(v){touches.delete(v.pointerId);if(!touches.size)pointer=null;if(touches.size<2)ps=0}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);c.addEventListener('wheel',v=>{v.preventDefault();zoom=clamp(zoom-v.deltaY*.0012,0,1)},{passive:false});
speed.addEventListener('input',()=>speedLabel.value=compact(rate())+' yr/s');speedLabel.value=compact(rate())+' yr/s';status.remove();requestAnimationFrame(frame);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.08,(now-last)/1000);last=now;if(pointer===null&&touches.size<2)yaw+=dt*.03;const rr=rate();years+=rr*dt;for(let i=0;i<N;i+=8){const target=clamp(m[i]*t[i]*1.5-.18,0,1);f[i]+=(target-f[i])*clamp(rr*dt/200000,0,.01)}draw(now);yearEl.textContent=formatYears(years)}
function draw(now){const w=c.width,h=c.height,D=img.data;D.fill(0);depth.fill(-Infinity);const s=Math.min(w,h)*(.27+zoom*.62),cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);for(let i=0;i<N;i++){const X=p[i*3],Y=p[i*3+1],Z=p[i*3+2];let xx=X*cy-Z*sy,zz=X*sy+Z*cy,yy=Y*cx-zz*sx;zz=Y*sx+zz*cx;const R=1+Math.max(0,e[i]-.47)*.075;xx*=R;yy*=R;zz*=R;if(zz<=0)continue;const px=Math.round(w/2+xx*s),py=Math.round(h/2-yy*s);if(px<0||py<0||px>=w||py>=h)continue;const di=py*w+px;if(zz<=depth[di])continue;depth[di]=zz;const C=color(i),L=clamp(.28-xx*.16+yy*.1+zz*.88,.16,1.22),q=di*4;D[q]=Math.min(255,C[0]*L);D[q+1]=Math.min(255,C[1]*L);D[q+2]=Math.min(255,C[2]*L);D[q+3]=255}x.putImageData(img,0,0);x.globalAlpha=.16+Math.sin(now*.0002)*.04;x.fillStyle='#e8f7ff';for(let i=0;i<N;i+=3){if(!cloud[i])continue;const X=p[i*3],Y=p[i*3+1],Z=p[i*3+2],cc=Math.cos(yaw+now*.000018),ss=Math.sin(yaw+now*.000018);let xx=X*cc-Z*ss,zz=X*ss+Z*cc,yy=Y*cx-zz*sx;zz=Y*sx+zz*cx;if(zz<=0)continue;x.fillRect(w/2+xx*s*1.035,h/2-yy*s*1.035,1,1)}x.globalAlpha=1}
function color(i){if(e[i]<.47)return[8,58,104];if(t[i]<.14||e[i]>.84)return[220,232,240];if(r[i]>.7)return[22,132,196];if(city[i]>.08)return[245,165,48];if(m[i]<.22)return[165,126,58];return[45+(1-f[i])*42,85+f[i]*82,40+f[i]*28]}
function dist(){const a=[...touches.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}function rate(){return Number(speed.value)<.05?0:Math.pow(10,Number(speed.value))}function compact(v){return v<1000?Math.round(v).toLocaleString():v<1e6?(v/1000).toFixed(1)+'k':(v/1e6).toFixed(1)+'M'}function formatYears(v){return v<1000?Math.floor(v).toLocaleString()+' years':v<1e6?(v/1000).toFixed(1)+' thousand years':(v/1e6).toFixed(2)+' million years'}function hash(v){let h=Math.imul(v^0x9e3779b9,2654435761);h^=h>>>16;return(h>>>0)/4294967295}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
}catch(err){status.textContent='Unable to start: '+err.message}
})();
</script></body></html>
