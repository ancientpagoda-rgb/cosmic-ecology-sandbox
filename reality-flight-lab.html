<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Flight Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border:1px solid rgba(145,185,215,.18);border-radius:14px;background:rgba(5,12,20,.5);backdrop-filter:blur(12px)}.top{display:flex;justify-content:space-between;font-size:.72rem;color:#cfe7f8}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:7px}.row label,.row output{font-size:.66rem;color:#acc8db}.controls{position:fixed;right:14px;bottom:120px;display:grid;grid-template-columns:46px 46px;gap:8px}.controls button{height:46px;border-radius:14px;border:1px solid rgba(145,185,215,.24);background:rgba(12,31,47,.78);color:#eaf7ff;font-size:1.2rem}.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:7px 10px;border-radius:999px;background:rgba(5,15,24,.6);border:1px solid rgba(135,186,225,.18);font-size:.65rem;color:#a9d1ec}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:rgba(5,12,20,.8);color:#d7efff;font-size:.82rem}input{width:100%;accent-color:#8fc6ff}</style></head><body><canvas id="view"></canvas><div id="status" class="status">Building flight world…</div><div id="badge" class="badge">ORBIT · 12,000 km</div><div class="controls"><button id="forward">▲</button><button id="back">▼</button></div><section class="hud"><div class="top"><span id="mode">Orbit</span><span id="coords">0°, 0°</span></div><div class="row"><label>ALTITUDE</label><input id="altitude" type="range" min="0" max="1" step="0.001" value="0"><output id="altLabel">12,000 km</output></div><div class="row"><label>TIME</label><input id="timeSpeed" type="range" min="0" max="6" step="0.01" value="2.4"><output id="year">0 yr</output></div></section><script>
(()=>{const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false}),status=document.getElementById('status'),alt=document.getElementById('altitude'),altLabel=document.getElementById('altLabel'),badge=document.getElementById('badge'),modeEl=document.getElementById('mode'),coords=document.getElementById('coords'),timeSpeed=document.getElementById('timeSpeed'),yearEl=document.getElementById('year'),forward=document.getElementById('forward'),back=document.getElementById('back');if(!ctx){status.textContent='Canvas unavailable';return}const N=26000,p=new Float32Array(N*3),e=new Float32Array(N),col=new Uint8Array(N*3),gold=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const y=1-(i+.5)/N*2,r=Math.sqrt(Math.max(0,1-y*y)),a=gold*i+(hash(i)-.5)*.04,x=Math.cos(a)*r,z=Math.sin(a)*r;p[i*3]=x;p[i*3+1]=y;p[i*3+2]=z;const h=clamp(.5+Math.sin(x*4.5+z*2.2)*.16+Math.sin(y*7-x*3)*.12+Math.pow(1-Math.abs(Math.sin(x*12+y*9-z*10)),2.2)*.22,0,1);e[i]=h;const c=color(h,y,x,z);col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2]}let yaw=.45,pitch=-.12,lat=0,lon=0,heading=0,years=0,last=performance.now(),pointer=null,lx=0,ly=0,img,depth,move=0;function resize(){const d=Math.min(devicePixelRatio||1,1.15),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;img=ctx.createImageData(w,h);depth=new Float32Array(w*h)}}resize();addEventListener('resize',resize);canvas.addEventListener('pointerdown',v=>{pointer=v.pointerId;lx=v.clientX;ly=v.clientY;canvas.setPointerCapture?.(v.pointerId)});canvas.addEventListener('pointermove',v=>{if(v.pointerId!==pointer)return;const dx=v.clientX-lx,dy=v.clientY-ly;if(Number(alt.value)<.78){yaw+=dx*.008;pitch=clamp(pitch+dy*.008,-1.35,1.35)}else{heading+=dx*.004;pitch=clamp(pitch+dy*.004,-.65,.65)}lx=v.clientX;ly=v.clientY});const release=v=>{if(v.pointerId===pointer)pointer=null};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('wheel',v=>{v.preventDefault();alt.value=String(clamp(Number(alt.value)-v.deltaY*.0008,0,1))},{passive:false});for(const [b,d] of [[forward,1],[back,-1]]){b.addEventListener('pointerdown',()=>move=d);b.addEventListener('pointerup',()=>move=0);b.addEventListener('pointercancel',()=>move=0)}status.remove();requestAnimationFrame(frame);function frame(now){requestAnimationFrame(frame);const dt=Math.min(.08,(now-last)/1000);last=now;const a=Number(alt.value),surface=smoothstep(.72,.96,a);if(surface>0){lat=clamp(lat+Math.cos(heading)*move*dt*.08,-1.45,1.45);lon+=Math.sin(heading)*move*dt*.08/Math.max(.2,Math.cos(lat))}else if(pointer===null)yaw+=dt*.025;years+=Math.pow(10,Number(timeSpeed.value))*dt;draw(a,surface,now);const km=Math.round(12000*Math.pow(1-a,2.35));altLabel.value=km>1?km.toLocaleString()+' km':Math.max(0,Math.round(km*1000))+' m';badge.textContent=(surface>.75?'SURFACE':a>.55?'ATMOSPHERE':'ORBIT')+' · '+altLabel.value;modeEl.textContent=surface>.75?'Flight':a>.55?'Atmospheric descent':'Orbit';coords.textContent=(lat*180/Math.PI).toFixed(1)+'°, '+(lon*180/Math.PI).toFixed(1)+'°';yearEl.value=formatYears(years)}function draw(a,surface,now){const w=canvas.width,h=canvas.height;if(surface<.95){drawOrbit(a,surface,w,h)}if(surface>0){ctx.globalAlpha=surface;drawTerrain(surface,w,h,now);ctx.globalAlpha=1}}function drawOrbit(a,surface,w,h){const D=img.data;D.fill(0);depth.fill(-Infinity);const scale=Math.min(w,h)*(.22+a*.76),cx=w/2,cy=h/2,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,a>.55?'#153f62':'#02060b');sky.addColorStop(1,a>.55?'#77b5d8':'#02060b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);const ocean=ctx.createRadialGradient(cx-scale*.25,cy-scale*.25,scale*.1,cx,cy,scale);ocean.addColorStop(0,'#174f75');ocean.addColorStop(1,'#031522');ctx.fillStyle=ocean;ctx.beginPath();ctx.arc(cx,cy,scale,0,Math.PI*2);ctx.fill();for(let i=0;i<N;i++){const X=p[i*3],Y=p[i*3+1],Z=p[i*3+2];let x=X*ca-Z*sa,z=X*sa+Z*ca,y=Y*cp-z*sp;z=Y*sp+z*cp;const R=1+(e[i]-.47)*.09;x*=R;y*=R;z*=R;if(z<=0||e[i]<.47)continue;const px=Math.round(cx+x*scale),py=Math.round(cy-y*scale);if(px<0||py<0||px>=w||py>=h)continue;const di=py*w+px;if(z<=depth[di])continue;depth[di]=z;const q=di*4,L=clamp(.25-x*.15+y*.1+z*.92,.15,1.25);D[q]=col[i*3]*L;D[q+1]=col[i*3+1]*L;D[q+2]=col[i*3+2]*L;D[q+3]=255}ctx.putImageData(img,0,0);const rim=ctx.createRadialGradient(cx,cy,scale*.8,cx,cy,scale*1.08);rim.addColorStop(.8,'rgba(50,150,240,0)');rim.addColorStop(1,'rgba(90,200,255,.35)');ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,scale*1.08,0,Math.PI*2);ctx.fill()}function drawTerrain(surface,w,h,now){const horizon=h*(.42+pitch*.22),sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4c92bd');sky.addColorStop(1,'#b9d9e9');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);ctx.fillStyle='#224c63';ctx.fillRect(0,horizon,w,h-horizon);const strips=160,cols=180,view=2.8*(1-surface)+.55;for(let row=strips-1;row>=0;row--){const z=row/strips*view+.03,screenY=horizon+(h-horizon)*(1-Math.exp(-z*2.1)),nextY=horizon+(h-horizon)*(1-Math.exp(-(z+view/strips)*2.1));ctx.beginPath();for(let j=0;j<=cols;j++){const u=(j/cols-.5)*2.4*z+Math.sin(heading)*lon;const v=z+Math.cos(heading)*lat;const H=terrain(u,v);const sx=j/cols*w,sy=screenY-H*(40+surface*150)/(z+.18);if(j===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy)}ctx.lineTo(w,nextY+120);ctx.lineTo(0,nextY+120);ctx.closePath();const shade=.45+.5*row/strips;ctx.fillStyle=terrainColor(row/strips,shade);ctx.fill()}ctx.globalAlpha=.12;ctx.fillStyle='#fff';for(let i=0;i<120;i++){const px=(hash(i*71+Math.floor(now/80))*w),py=horizon*hash(i*29+3);ctx.fillRect(px,py,2,1)}ctx.globalAlpha=1}function terrain(x,z){return Math.sin(x*2.1+z*.8)*.16+Math.sin(z*3.8-x*.7)*.11+Math.pow(Math.abs(Math.sin(x*5.4+z*4.1)),2.4)*.24}function terrainColor(depth,shade){if(depth<.2)return`rgb(${30*shade},${96*shade},${55*shade})`;if(depth<.7)return`rgb(${58*shade},${118*shade},${62*shade})`;return`rgb(${95*shade},${102*shade},${75*shade})`}function color(h,y,x,z){if(h<.47)return[12,67,110];if(Math.abs(y)>.82||h>.86)return[225,235,240];const wet=.5+Math.sin(z*6-x*2.5)*.3;if(wet<.25)return[168,132,62];return[45,110+wet*55,48]}function formatYears(v){return v<1000?Math.floor(v)+' yr':v<1e6?(v/1000).toFixed(1)+' kyr':(v/1e6).toFixed(2)+' Myr'}function hash(v){let h=Math.imul(v^0x9e3779b9,2654435761);h^=h>>>16;return(h>>>0)/4294967295}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function smoothstep(a,b,v){v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)}})();
</script></body></html>
