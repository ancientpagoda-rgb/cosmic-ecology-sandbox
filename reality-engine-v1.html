<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Engine v1</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:10px 12px;border:1px solid #8eb4d233;border-radius:14px;background:#07111dcc;backdrop-filter:blur(12px)}.top{display:flex;justify-content:space-between;font-size:.72rem;color:#d7efff}.row{display:grid;grid-template-columns:64px 1fr 74px;gap:8px;align-items:center;margin-top:7px}.row label,.row output{font-size:.65rem;color:#aac9dd}.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;padding:7px 10px;border-radius:999px;background:#07111dcc;border:1px solid #8eb4d233;font-size:.65rem;color:#bfe3fb}.controls{position:fixed;right:14px;bottom:124px;display:grid;grid-template-columns:46px 46px;gap:8px}.controls button{height:46px;border-radius:14px;border:1px solid #8eb4d244;background:#0b2033dd;color:#eefaff;font-size:1.15rem}.status{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#07111dee;color:#d7efff;font-size:.8rem}input{width:100%;accent-color:#8fc6ff}</style></head><body><canvas id="c"></canvas><div id="status" class="status">Building shared world…</div><div id="badge" class="badge">ENGINE V1 · ORBIT</div><div class="controls"><button id="f">▲</button><button id="b">▼</button></div><section class="hud"><div class="top"><span id="mode">Orbit</span><span id="coords">0.0°, 0.0°</span></div><div class="row"><label>ALTITUDE</label><input id="alt" type="range" min="0" max="1" step="0.001" value="0"><output id="altText">12,000 km</output></div><div class="row"><label>TIME</label><input id="speed" type="range" min="0" max="6" step="0.01" value="2.2"><output id="year">0 yr</output></div></section><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),status=document.getElementById('status'),alt=document.getElementById('alt'),altText=document.getElementById('altText'),badge=document.getElementById('badge'),mode=document.getElementById('mode'),coords=document.getElementById('coords'),speed=document.getElementById('speed'),year=document.getElementById('year'),F=document.getElementById('f'),B=document.getElementById('b');if(!x){status.textContent='Canvas unavailable';return}let W=0,H=0,D=1,img,depth;function resize(){D=Math.min(devicePixelRatio||1,1.1);W=Math.floor(innerWidth*D);H=Math.floor(innerHeight*D);c.width=W;c.height=H;img=x.createImageData(W,H);depth=new Float32Array(W*H)}resize();addEventListener('resize',resize);const N=15000,P=new Float32Array(N*3),gold=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const y=1-(i+.5)/N*2,r=Math.sqrt(1-y*y),a=gold*i;P[i*3]=Math.cos(a)*r;P[i*3+1]=y;P[i*3+2]=Math.sin(a)*r}let yaw=.35,pitch=-.1,lat=0,lon=0,heading=0,move=0,pid=null,lx=0,ly=0,years=0,last=performance.now();const hold=(el,d)=>{el.onpointerdown=e=>{move=d;el.setPointerCapture?.(e.pointerId)};el.onpointerup=el.onpointercancel=()=>move=0};hold(F,1);hold(B,-1);c.onpointerdown=e=>{pid=e.pointerId;lx=e.clientX;ly=e.clientY;c.setPointerCapture?.(pid)};c.onpointermove=e=>{if(e.pointerId!==pid)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(+alt.value<.78){yaw+=dx*.008;pitch=clamp(pitch+dy*.008,-1.35,1.35)}else{heading+=dx*.004;pitch=clamp(pitch+dy*.004,-.55,.55)}lx=e.clientX;ly=e.clientY};c.onpointerup=c.onpointercancel=e=>{if(e.pointerId===pid)pid=null};c.addEventListener('wheel',e=>{e.preventDefault();alt.value=clamp(+alt.value-e.deltaY*.0008,0,1)},{passive:false});status.remove();requestAnimationFrame(frame);function frame(t){requestAnimationFrame(frame);const dt=Math.min(.06,(t-last)/1000);last=t;const a=+alt.value,s=sm(.70,.96,a);if(s>.02){lat=clamp(lat+Math.cos(heading)*move*dt*.055,-1.48,1.48);lon+=Math.sin(heading)*move*dt*.055/Math.max(.18,Math.cos(lat))}else if(pid===null)yaw+=dt*.018;years+=Math.pow(10,+speed.value)*dt;draw(a,s);const km=Math.round(12000*Math.pow(1-a,2.35));altText.value=km>1?km.toLocaleString()+' km':Math.round(km*1000)+' m';const stage=s>.75?'SURFACE':a>.55?'ATMOSPHERE':'ORBIT';badge.textContent='ENGINE V1 · '+stage;mode.textContent=s>.75?'Shared-world flight':a>.55?'Shared-world descent':'Shared-world orbit';coords.textContent=(lat*180/Math.PI).toFixed(1)+'°, '+(lon*180/Math.PI).toFixed(1)+'°';year.value=years<1e3?Math.floor(years)+' yr':years<1e6?(years/1e3).toFixed(1)+' kyr':(years/1e6).toFixed(2)+' Myr'}function draw(a,s){drawOrbit(a);if(s>0){x.globalAlpha=s;drawSurface(s);x.globalAlpha=1}}function drawOrbit(a){const data=img.data;data.fill(0);depth.fill(-1e9);const scale=Math.min(W,H)*(.22+a*.72),cx=W/2,cy=H/2,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,a>.55?'#153f62':'#02060b');sky.addColorStop(1,a>.55?'#79b6d8':'#02060b');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#08263a';x.beginPath();x.arc(cx,cy,scale,0,Math.PI*2);x.fill();for(let i=0;i<N;i++){const X=P[i*3],Y=P[i*3+1],Z=P[i*3+2],la=Math.asin(Y),lo=Math.atan2(Z,X),q=sample(la,lo);let xx=X*ca-Z*sa,zz=X*sa+Z*ca,yy=Y*cp-zz*sp;zz=Y*sp+zz*cp;const R=1+q.e*.075;xx*=R;yy*=R;zz*=R;if(zz<=0)continue;const px=Math.round(cx+xx*scale),py=Math.round(cy-yy*scale);if(px<0||py<0||px>=W||py>=H)continue;const di=py*W+px;if(zz<=depth[di])continue;depth[di]=zz;const k=di*4,L=clamp(.22+zz*.95+yy*.08,.18,1.2),C=palette(q);data[k]=C[0]*L;data[k+1]=C[1]*L;data[k+2]=C[2]*L;data[k+3]=255}x.putImageData(img,0,0);const rim=x.createRadialGradient(cx,cy,scale*.82,cx,cy,scale*1.09);rim.addColorStop(.78,'#4bb8ff00');rim.addColorStop(1,'#63c7ff55');x.fillStyle=rim;x.beginPath();x.arc(cx,cy,scale*1.09,0,Math.PI*2);x.fill()}function drawSurface(s){const horizon=H*(.42+pitch*.2),sky=x.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4e93bd');sky.addColorStop(1,'#c6e1ef');x.fillStyle=sky;x.fillRect(0,0,W,horizon);x.fillStyle='#315c68';x.fillRect(0,horizon,W,H-horizon);const rows=110,cols=120,range=2.6*(1-s)+.5;for(let r=rows-1;r>=0;r--){const z=.025+r/rows*range,z2=.025+(r+1)/rows*range,sy=horizon+(H-horizon)*(1-Math.exp(-z*2.05)),sy2=horizon+(H-horizon)*(1-Math.exp(-z2*2.05));x.beginPath();let avg=0;for(let j=0;j<=cols;j++){const east=(j/cols-.5)*2.25*z,north=z;const la=clamp(lat+(north*Math.cos(heading)-east*Math.sin(heading))*.018,-1.55,1.55),lo=lon+(north*Math.sin(heading)+east*Math.cos(heading))*.018/Math.max(.2,Math.cos(lat)),q=sample(la,lo);avg+=q.e;const sx=j/cols*W,yy=sy-q.e*(80+s*185)/(z+.16);j?x.lineTo(sx,yy):x.moveTo(sx,yy)}x.lineTo(W,sy2+100);x.lineTo(0,sy2+100);x.closePath();const q=sample(lat+r*.0007,lon+r*.0009),C=palette(q),shade=.45+.5*r/rows;x.fillStyle=`rgb(${C[0]*shade},${C[1]*shade},${C[2]*shade})`;x.fill()}}function sample(la,lo){const X=Math.cos(la)*Math.cos(lo),Y=Math.sin(la),Z=Math.cos(la)*Math.sin(lo),c=Math.sin(X*3.1+Z*1.7)+Math.sin(Y*4.7-X*2.2)*.7,r=Math.abs(Math.sin(X*11+Y*8-Z*9)),detail=Math.sin((X+Z)*31+Y*17)*.08,e=clamp((c*.18+Math.pow(r,2.3)*.28+detail)-.06,-.35,.65),temp=1-Math.abs(Y),wet=clamp(.5+.3*Math.sin(Z*7-X*3)+.15*Math.sin(Y*13),0,1);return{e,temp,wet}}function palette(q){if(q.e<0)return[13,72,116];if(q.temp<.2||q.e>.48)return[226,235,239];if(q.wet<.28)return[171,132,67];if(q.wet>.72)return[34,116,65];return[58,132,68]}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function sm(a,b,v){v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)}})();</script></body></html>
