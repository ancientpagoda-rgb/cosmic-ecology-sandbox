name: Verify live unified runtime

on:
  workflow_run:
    workflows: ["Deploy Vite site to Pages"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-unified-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy workflow succeeded
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: test "${CONCLUSION}" = "success"

      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Run live unified runtime diagnostics
        id: unified_live
        env:
          REALITY_BASE_URL: https://ancientpagoda-rgb.github.io/reality-sandbox/?verify=${{ github.event.workflow_run.head_sha }}
          REALITY_UNIFIED_ARTIFACT_DIR: artifacts/unified-live
        run: node scripts/unified-smoke.cjs

      - name: Upload live unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-live-${{ github.event.workflow_run.head_sha }}
          path: artifacts/unified-live
          if-no-files-found: warn
          retention-days: 30

      - name: Publish unified live status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const deployOk = '${{ github.event.workflow_run.conclusion }}' === 'success';
            const runtimeOk = '${{ steps.unified_live.outcome }}' === 'success';
            const ok = deployOk && runtimeOk;
            const sha = '${{ github.event.workflow_run.head_sha }}';
            let failure = 'Unified runtime live verification failed';
            if (!ok) {
              const fatalPath = 'artifacts/unified-live/fatal-error.txt';
              if (fs.existsSync(fatalPath)) {
                failure = fs.readFileSync(fatalPath, 'utf8').split(/\r?\n/).find(Boolean) || failure;
              }
            }
            const description = ok
              ? 'Procedural living planet and integrated inspector verified live'
              : failure.replace(/^Error:\s*/i, '').replace(/\s+/g, ' ').slice(0, 140);
            const baseUrl = `https://ancientpagoda-rgb.github.io/reality-sandbox/?verify=${sha}`;
            const diagnosticText = ok ? 'ok' : failure.slice(0, 90);
            const diagnosticB64 = Buffer.from(diagnosticText, 'utf8').toString('base64url');
            const diagnosticUrl = `${baseUrl}&diagnostic_b64=${diagnosticB64}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/unified-runtime-live',
              description,
              target_url: baseUrl,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/unified-runtime-diagnostic',
              description: ok ? 'No live runtime error' : 'Exact live error encoded in target URL',
              target_url: diagnosticUrl,
            });
