name: Browser simulation diagnostics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Run integration audit
        run: npm run audit:integration

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          echo $! > /tmp/reality-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Verify iPhone sphere aspect
        id: iphone_sphere_test
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_IPHONE_ARTIFACT_DIR: artifacts/iphone-sphere-smoke
        run: node scripts/iphone-sphere-smoke.cjs

      - name: Run Phase 11 browser diagnostics
        id: browser_test
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_ARTIFACT_DIR: artifacts/browser-smoke
        run: node scripts/browser-smoke.cjs

      - name: Run unified runtime diagnostics
        id: unified_test
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_UNIFIED_ARTIFACT_DIR: artifacts/unified-smoke
          REALITY_REQUIRE_REBOUND: "0"
        run: node scripts/unified-smoke.cjs

      - name: Verify Pixi-only root
        id: root_renderer_test
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_ROOT_RENDERER_ARTIFACT_DIR: artifacts/root-renderer-smoke
        run: node scripts/root-renderer-smoke.cjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-browser-diagnostics-${{ github.sha }}
          path: |
            artifacts/browser-smoke
            artifacts/unified-smoke
            artifacts/root-renderer-smoke
            artifacts/iphone-sphere-smoke
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish browser status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const phase11Ok = '${{ steps.browser_test.outcome }}' === 'success';
            const unifiedOk = '${{ steps.unified_test.outcome }}' === 'success';
            const rootRendererOk = '${{ steps.root_renderer_test.outcome }}' === 'success';
            const iphoneSphereOk = '${{ steps.iphone_sphere_test.outcome }}' === 'success';
            const ok = phase11Ok && unifiedOk && rootRendererOk && iphoneSphereOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'browser/unified-runtime',
              description: ok ? 'Phase 11, runtime, Pixi root, and iPhone sphere diagnostics passed' : 'A browser, runtime, renderer, or iPhone sphere diagnostic failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
            });
