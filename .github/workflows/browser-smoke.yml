name: Browser simulation diagnostics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending browser status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'browser/unified-runtime',
              description: 'Single-world browser diagnostics are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run integration audit
        run: npm run audit:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          echo $! > /tmp/reality-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Run desktop, ultrawide, and mobile reality diagnostics
        id: unified_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_CHECK_ARTIFACT_DIR: artifacts/unified-smoke
        run: node scripts/reality-check.cjs

      - name: Verify one scene and camera from ground to globe
        id: continuity_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_CHECK_ARTIFACT_DIR: artifacts/continuous-world-view
        run: node scripts/continuous-world-view-check.cjs

      - name: Enforce single-world rendering performance
        id: performance_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_PERFORMANCE_ARTIFACT_DIR: artifacts/single-world-performance
        run: node scripts/single-world-performance-check.cjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-browser-diagnostics-${{ github.sha }}
          path: |
            artifacts/unified-smoke
            artifacts/continuous-world-view
            artifacts/single-world-performance
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish browser status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const unifiedOk = '${{ steps.unified_test.outcome }}' === 'success';
            const continuityOk = '${{ steps.continuity_test.outcome }}' === 'success';
            const performanceOk = '${{ steps.performance_test.outcome }}' === 'success';
            const ok = unifiedOk && continuityOk && performanceOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'browser/unified-runtime',
              description: ok ? 'One-scene world, mobile, continuity, and performance checks passed' : 'A single-world browser diagnostic failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!ok) core.setFailed('One or more single-world browser diagnostics failed.');
