name: Browser simulation diagnostics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending browser status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'browser/unified-runtime',
              description: 'Living-planet browser diagnostics are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run integration audit
        run: npm run audit:integration

      - name: Verify multiscale reality kernel
        run: npm run check:kernel

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          echo $! > /tmp/reality-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Verify camera-driven reality refinement
        id: kernel_camera_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
        run: npm run check:kernel-browser

      - name: Verify iPhone sphere aspect
        id: iphone_sphere_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_IPHONE_ARTIFACT_DIR: artifacts/iphone-sphere-smoke
        run: node scripts/iphone-sphere-smoke.cjs

      - name: Run current unified reality diagnostics
        id: unified_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_CHECK_ARTIFACT_DIR: artifacts/unified-smoke
        run: node scripts/reality-check.cjs

      - name: Verify Pixi simulation root
        id: root_renderer_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_ROOT_RENDERER_ARTIFACT_DIR: artifacts/root-renderer-smoke
        run: node scripts/root-renderer-smoke.cjs

      - name: Enforce startup and Surface Mode budgets
        id: performance_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_PERFORMANCE_ARTIFACT_DIR: artifacts/performance-smoke
        run: node scripts/performance-smoke.cjs

      - name: Enter, move through, and exit surface mode
        id: surface_mode_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_SURFACE_MODE_ARTIFACT_DIR: artifacts/surface-mode-smoke
        run: node scripts/surface-mode-smoke.cjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-browser-diagnostics-${{ github.sha }}
          path: |
            artifacts/unified-smoke
            artifacts/root-renderer-smoke
            artifacts/iphone-sphere-smoke
            artifacts/surface-mode-smoke
            artifacts/performance-smoke
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish browser status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const kernelCameraOk = '${{ steps.kernel_camera_test.outcome }}' === 'success';
            const unifiedOk = '${{ steps.unified_test.outcome }}' === 'success';
            const rootRendererOk = '${{ steps.root_renderer_test.outcome }}' === 'success';
            const iphoneSphereOk = '${{ steps.iphone_sphere_test.outcome }}' === 'success';
            const surfaceModeOk = '${{ steps.surface_mode_test.outcome }}' === 'success';
            const performanceOk = '${{ steps.performance_test.outcome }}' === 'success';
            const ok = kernelCameraOk && unifiedOk && rootRendererOk && iphoneSphereOk && surfaceModeOk && performanceOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'browser/unified-runtime',
              description: ok ? 'Living planet, reality refinement, surface mode, and iPhone checks passed' : 'A living-planet browser, reality-refinement, or visual check failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!ok) core.setFailed('One or more browser diagnostics failed.');
