name: Browser visual and simulation diagnostics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending browser status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'browser/visual-quality',
              description: 'Reality, frontier, iPhone, surface, performance, and visual checks are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run integration audit
        run: npm run audit:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reality-preview.log 2>&1 &
          echo $! > /tmp/reality-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/reality-preview.log
          exit 1

      - name: Run reality check
        id: reality_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_CHECK_ARTIFACT_DIR: artifacts/reality-check
        run: node scripts/reality-check.cjs

      - name: Verify frontier lab route
        id: frontier_lab_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_FRONTIER_ARTIFACT_DIR: artifacts/frontier-lab-smoke
        run: node scripts/frontier-lab-smoke.cjs

      - name: Verify iPhone sphere aspect
        id: iphone_sphere_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_IPHONE_ARTIFACT_DIR: artifacts/iphone-sphere-smoke
        run: node scripts/iphone-sphere-smoke.cjs

      - name: Verify classic Surface Mode fallback behavior
        id: surface_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/?renderer=classic
          REALITY_SURFACE_MODE_ARTIFACT_DIR: artifacts/surface-mode-smoke
        run: node scripts/surface-mode-smoke.cjs

      - name: Enforce startup and Surface Mode budgets
        id: performance_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_PERFORMANCE_ARTIFACT_DIR: artifacts/performance-smoke
        run: node scripts/performance-smoke.cjs

      - name: Capture and enforce production visual quality
        id: visual_test
        continue-on-error: true
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/
          REALITY_VISUAL_ARTIFACT_DIR: artifacts/visual-regression
        run: node scripts/visual-quality-check.cjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-browser-visuals-${{ github.sha }}
          path: |
            artifacts/reality-check
            artifacts/frontier-lab-smoke
            artifacts/iphone-sphere-smoke
            artifacts/surface-mode-smoke
            artifacts/performance-smoke
            artifacts/visual-regression
            /tmp/reality-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish browser status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const realityOk = '${{ steps.reality_test.outcome }}' === 'success';
            const frontierLabOk = '${{ steps.frontier_lab_test.outcome }}' === 'success';
            const iphoneSphereOk = '${{ steps.iphone_sphere_test.outcome }}' === 'success';
            const surfaceModeOk = '${{ steps.surface_test.outcome }}' === 'success';
            const performanceOk = '${{ steps.performance_test.outcome }}' === 'success';
            const visualOk = '${{ steps.visual_test.outcome }}' === 'success';
            const ok = realityOk && frontierLabOk && iphoneSphereOk && surfaceModeOk && performanceOk && visualOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'browser/visual-quality',
              description: ok ? 'Reality, frontier, iPhone, surface, performance, and visual checks passed' : `Reality=${realityOk ? 'ok' : 'failed'} frontier=${frontierLabOk ? 'ok' : 'failed'} iPhone=${iphoneSphereOk ? 'ok' : 'failed'} surface=${surfaceModeOk ? 'ok' : 'failed'} performance=${performanceOk ? 'ok' : 'failed'} visual=${visualOk ? 'ok' : 'failed'}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail because reality check failed
        if: always() && steps.reality_test.outcome != 'success'
        run: exit 1

      - name: Fail because frontier lab route failed
        if: always() && steps.frontier_lab_test.outcome != 'success'
        run: exit 1

      - name: Fail because iPhone sphere smoke failed
        if: always() && steps.iphone_sphere_test.outcome != 'success'
        run: exit 1

      - name: Fail because classic Surface fallback smoke failed
        if: always() && steps.surface_test.outcome != 'success'
        run: exit 1

      - name: Fail because performance smoke failed
        if: always() && steps.performance_test.outcome != 'success'
        run: exit 1

      - name: Fail because production visual regression failed
        if: always() && steps.visual_test.outcome != 'success'
        run: exit 1
