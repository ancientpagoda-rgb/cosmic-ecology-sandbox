name: Verify live Phase 8 root

on:
  workflow_run:
    workflows: ["Deploy Vite site to Pages"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-phase8:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy workflow succeeded
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          test "${CONCLUSION}" = "success"

      - name: Fetch live root and Phase 8 bundle
        id: livecheck
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE_URL="https://ancientpagoda-rgb.github.io/reality-sandbox/"

          fetch_live() {
            local url="$1"
            local output="$2"
            rm -f "${output}"
            for attempt in $(seq 1 18); do
              echo "Attempt ${attempt}/18: ${url}"
              if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 \
                --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
                "${url}" --output "${output}" && test -s "${output}"; then
                return 0
              fi
              rm -f "${output}"
              sleep 10
            done
            return 1
          }

          fetch_live "${BASE_URL}?verify=${HEAD_SHA}" /tmp/phase8-index.html
          grep -q "single deterministic lo-fi pixel living world" /tmp/phase8-index.html
          ASSET_PATH=$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/phase8-index.html | head -n 1 | cut -d'"' -f2)
          test -n "${ASSET_PATH}"
          if [[ "${ASSET_PATH}" == http* ]]; then
            ASSET_URL="${ASSET_PATH}"
          elif [[ "${ASSET_PATH}" == /* ]]; then
            ASSET_URL="https://ancientpagoda-rgb.github.io${ASSET_PATH}"
          else
            ASSET_URL="${BASE_URL}${ASSET_PATH}"
          fi
          fetch_live "${ASSET_URL}?verify=${HEAD_SHA}" /tmp/phase8-app.js
          grep -q "PHASE 8 · PLANETARY SYSTEMS" /tmp/phase8-app.js
          grep -q "realitySandboxDebug" /tmp/phase8-app.js
          grep -q "civilization.phase8-institutions-industry-spaceflight" /tmp/phase8-app.js
          grep -q "Spector.js" /tmp/phase8-app.js

      - name: Upload live bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-live-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/phase8-index.html
            /tmp/phase8-app.js
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Phase 8 live status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployOk = '${{ github.event.workflow_run.conclusion }}' === 'success';
            const liveOk = '${{ steps.livecheck.outcome }}' === 'success';
            const ok = deployOk && liveOk;
            const sha = '${{ github.event.workflow_run.head_sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/phase8-live',
              description: ok ? 'Phase 8 root bundle and debug bridge verified live' : 'Phase 8 live verification failed',
              target_url: `https://ancientpagoda-rgb.github.io/reality-sandbox/?verify=${sha}`,
            });
