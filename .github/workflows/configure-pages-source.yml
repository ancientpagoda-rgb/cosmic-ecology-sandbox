name: Configure Pages for Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  statuses: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Use GitHub Actions as the Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          curl --fail --silent --show-error --location \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"build_type":"workflow"}' \
            "${API}" > /tmp/pages-update.json
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${API}" | jq -e '.build_type == "workflow"'

      - name: Publish Pages source status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.source.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/source-mode',
              description: ok ? 'GitHub Actions is the only Pages source' : 'Unable to switch Pages source to Actions',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`,
            });
