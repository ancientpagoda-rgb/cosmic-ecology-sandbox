name: Reality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending reality status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(printf '{"state":"pending","context":"reality-check/browser","description":"Chromium reality check is running","target_url":"%s"}' "$TARGET_URL")
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify multiscale reality kernel
        run: npm run check:kernel

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build sandbox
        run: npm run build

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/eidolon-preview.log 2>&1 &
          echo $! > /tmp/eidolon-preview.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eidolon-preview.log
          exit 1

      - name: Interact with and stress-test Eidolon
        id: reality
        continue-on-error: true
        run: npm run check:reality
        env:
          REALITY_BASE_URL: http://127.0.0.1:4173/

      - name: Preserve preview log
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/reality-check
          cp /tmp/eidolon-preview.log artifacts/reality-check/preview.log 2>/dev/null || true

      - name: Upload reality-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidolon-reality-check
          path: artifacts/reality-check
          if-no-files-found: warn
          retention-days: 14

      - name: Publish connector-visible reality status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REALITY_OUTCOME: ${{ steps.reality.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$REALITY_OUTCOME" = "success" ]; then
            state=success
            description='Browser interaction and stress test passed'
          else
            state=failure
            description='Browser interaction or stress test failed'
          fi
          payload=$(printf '{"state":"%s","context":"reality-check/browser","description":"%s","target_url":"%s"}' "$state" "$description" "$TARGET_URL")
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Fail workflow when reality check failed
        if: always() && steps.reality.outcome != 'success'
        run: exit 1
