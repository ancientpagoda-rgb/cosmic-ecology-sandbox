name: Deploy Vite site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-latest-v1

      - name: Build same-origin REBOUND WebAssembly
        run: |
          if [ ! -f .cache/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .cache/emsdk
          else
            git -C .cache/emsdk fetch --depth 1 origin main
            git -C .cache/emsdk reset --hard origin/main
          fi
          .cache/emsdk/emsdk install latest
          .cache/emsdk/emsdk activate latest
          source .cache/emsdk/emsdk_env.sh
          bash scripts/build-rebound-wasm.sh

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
