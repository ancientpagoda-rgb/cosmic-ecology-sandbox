name: Deploy Nysa living planet to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit and build Nysa
        run: npm run check

      - name: Verify public artifact identity
        run: |
          test -f dist/index.html
          grep -q "Reality Sandbox · Procedural Living Planet" dist/index.html
          grep -q "Nysa, a fictional procedural living planet" dist/index.html
          grep -R -q "procedural-living-planet" dist/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live Nysa root
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed Nysa identity
        id: livecheck
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "${PAGE_URL}"
          ROOT_URL="${PAGE_URL%/}/?verify=${GITHUB_SHA}"

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "${ROOT_URL}" --output /tmp/nysa-index.html \
              && grep -q "Reality Sandbox · Procedural Living Planet" /tmp/nysa-index.html \
              && grep -q "Nysa, a fictional procedural living planet" /tmp/nysa-index.html; then
              exit 0
            fi
            sleep 10
          done

          echo "Nysa root did not propagate within the verification window" >&2
          exit 1

      - name: Publish Nysa live status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.livecheck.outcome }}' === 'success';
            const base = '${{ needs.deploy.outputs.page_url }}'.replace(/\/$/, '');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/nysa-live',
              description: ok ? 'Nysa procedural living planet verified live' : 'Nysa root live verification failed',
              target_url: `${base}/?verify=${context.sha}`,
            });

  report-failure:
    name: Report Nysa deployment failure
    runs-on: ubuntu-latest
    needs: [build, deploy, verify-live]
    if: always() && needs.verify-live.result != 'success'
    steps:
      - name: Publish deployment failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'pages/nysa-live',
              description: `Nysa failed: build ${{ needs.build.result }}, deploy ${{ needs.deploy.result }}, verify ${{ needs.verify-live.result }}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
            });
