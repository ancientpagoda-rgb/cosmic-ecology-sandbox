name: Deploy Eidolon living planet to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

# Keep an in-progress production deployment alive. GitHub Pages can discard
# superseded queued runs without repeatedly killing the deployment that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending Pages status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'pages/deploy',
              description: 'Eidolon v86 Pages deployment is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Match the production artifact path already exercised by the dedicated
      # browser/reality workflows. Ecology/origin model checks remain CI checks;
      # they must not strand Pages on an older, broken deployment.
      - name: Audit integration
        run: npm run audit:integration

      - name: Build Eidolon
        run: npm run build

      - name: Stamp deployment SHA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          sha = os.environ['GITHUB_SHA']
          path = Path('dist/index.html')
          text = path.read_text()
          stamp = f'<meta name="reality-sandbox-deploy-sha" content="{sha}" />'
          text = text.replace('</head>', f'  {stamp}\n</head>', 1)
          path.write_text(text)
          Path('dist/version.json').write_text(json.dumps({'sha': sha}) + '\n')
          PY

      - name: Verify public artifact identity
        run: |
          test -f dist/index.html
          test -f dist/version.json
          grep -q "Eidolon · Procedural Plant Planet" dist/index.html
          grep -q "Eidolon, a fictional procedural plant planet" dist/index.html
          grep -q "build-v86-smooth-spherical-default" dist/index.html
          grep -q "${GITHUB_SHA}" dist/index.html
          grep -q "${GITHUB_SHA}" dist/version.json
          grep -R -q "procedural-living-planet" dist/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published deployment identity
        id: verify
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 30); do
            version="$(curl -fsS --cache-control no-cache "${base}/version.json?sha=${EXPECTED_SHA}" 2>/dev/null || true)"
            index="$(curl -fsS --cache-control no-cache "${base}/?sha=${EXPECTED_SHA}" 2>/dev/null || true)"
            if printf '%s' "$version" | grep -q "$EXPECTED_SHA" \
              && printf '%s' "$index" | grep -q 'build-v86-smooth-spherical-default'; then
              echo "Published ${EXPECTED_SHA} with v86 smooth spherical default."
              exit 0
            fi
            sleep 4
          done
          echo "GitHub Pages did not expose the expected v86 deployment SHA/build marker."
          exit 1

      - name: Publish final Pages status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const deployed = '${{ steps.deployment.outcome }}' === 'success';
            const verified = '${{ steps.verify.outcome }}' === 'success';
            const ok = deployed && verified;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pages/deploy',
              description: ok ? 'Eidolon v86 is live on GitHub Pages' : `Pages deploy=${deployed ? 'ok' : 'failed'} verify=${verified ? 'ok' : 'failed'}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
