name: Deploy Vite site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-latest-v1

      - name: Build same-origin REBOUND WebAssembly
        run: |
          if [ ! -f .cache/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git .cache/emsdk
          else
            git -C .cache/emsdk fetch --depth 1 origin main
            git -C .cache/emsdk reset --hard origin/main
          fi
          .cache/emsdk/emsdk install latest
          .cache/emsdk/emsdk activate latest
          source .cache/emsdk/emsdk_env.sh
          bash scripts/build-rebound-wasm.sh

      - name: Build
        run: npm run build

      - name: Smoke test V6.7 artifact
        run: |
          test -f dist/reality-engine-v6-7.html
          test -f dist/rebound-v6-6/rebound.js
          test -f dist/rebound-v6-6/rebound.wasm
          grep -q "THREE.JS UNIVERSE" dist/reality-engine-v6-7.html
          grep -R -q "automatic astronomical scaling" dist/assets
          test -s dist/rebound-v6-6/rebound.wasm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live V6.7
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed HTML and REBOUND assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          BASE_URL="${PAGE_URL%/}/"
          V67_URL="${BASE_URL}reality-engine-v6-7.html"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --max-time 30 \
              "${V67_URL}?verify=${GITHUB_SHA}" \
              --output /tmp/reality-engine-v6-7.html; then
              break
            fi
            sleep 10
          done
          grep -q "THREE.JS UNIVERSE" /tmp/reality-engine-v6-7.html
          curl --fail --silent --show-error --location \
            --max-time 30 \
            "${BASE_URL}rebound-v6-6/rebound.js?verify=${GITHUB_SHA}" \
            --output /tmp/rebound.js
          curl --fail --silent --show-error --location \
            --max-time 30 \
            "${BASE_URL}rebound-v6-6/rebound.wasm?verify=${GITHUB_SHA}" \
            --output /tmp/rebound.wasm
          test -s /tmp/rebound.js
          test -s /tmp/rebound.wasm
          echo "Verified live V6.7: ${V67_URL}"
