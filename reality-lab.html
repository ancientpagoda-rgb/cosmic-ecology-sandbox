<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Reality Sandbox</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;padding:10px 12px;border:1px solid rgba(145,185,215,.18);border-radius:14px;background:rgba(5,12,20,.5);backdrop-filter:blur(12px)}.top{display:flex;justify-content:space-between;color:#dbeeff;font-size:.76rem;margin-bottom:7px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.row label,.row output{font-size:.68rem;color:#b9d6e9}input{width:100%;accent-color:#8fc6ff}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;color:#cfe8fa;background:rgba(5,12,20,.8);padding:10px 14px;border-radius:12px;font-size:.85rem}.badge{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:4;padding:6px 9px;border-radius:999px;background:rgba(4,11,18,.55);border:1px solid rgba(135,186,225,.14);color:#9fc7e3;font-size:.64rem;backdrop-filter:blur(10px)}</style></head><body><div id="app"></div><div id="status" class="status">Building adaptive planet…</div><div id="badge" class="badge">ORBIT · LOD 1</div><section class="hud"><div class="top"><span id="year">0 years</span><span>drag · pinch · scroll</span></div><div class="row"><label>TIME</label><input id="timeSpeed" type="range" min="0" max="6" step="0.01" value="2.6"><output id="speedLabel">398 yr/s</output></div></section><script>
(function(){
const app=document.getElementById('app'),status=document.getElementById('status'),yearEl=document.getElementById('year'),speed=document.getElementById('timeSpeed'),speedLabel=document.getElementById('speedLabel'),badge=document.getElementById('badge');
try{
const c=document.createElement('canvas'),ctx=c.getContext('2d',{alpha:false});if(!ctx)throw Error('Canvas unavailable');app.appendChild(c);
const N=42000,SEA=.47,p=new Float32Array(N*3),e=new Float32Array(N),m=new Float32Array(N),temp=new Float32Array(N),forest=new Float32Array(N),river=new Float32Array(N),city=new Float32Array(N),cloud1=new Uint8Array(N),cloud2=new Uint8Array(N),order=new Uint32Array(N),gold=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
 const j=(hash(i*17)-.5)*.82, y=clamp(1-((i+.5+j)/N)*2,-1,1), q=Math.sqrt(Math.max(0,1-y*y)), a=gold*i+(hash(i*71)-.5)*.055;
 const X=Math.cos(a)*q,Z=Math.sin(a)*q;p[i*3]=X;p[i*3+1]=y;p[i*3+2]=Z;order[i]=i;
 const low=.5+Math.sin(X*4.6+Z*2.1)*.13+Math.sin(y*6.8-X*3.2)*.11+Math.sin((X+Z-y)*2.4)*.08;
 const ridge=Math.pow(1-Math.abs(Math.sin(X*11.7+y*8.9-Z*10.3)),2.4)*.25;
 const detail=Math.sin(X*31+y*27+Z*23)*.025+Math.sin(X*67-y*41+Z*53)*.012;
 const E=clamp(low+ridge+detail,0,1);e[i]=E;
 temp[i]=clamp(.92-Math.abs(y)*.82-Math.max(0,E-.62)*.8,0,1);
 m[i]=clamp(.49+Math.sin(Z*6.1-X*2.7)*.23+Math.sin(y*10.4+Z*4.2)*.16+Math.sin((X-Z)*18)*.05,0,1);
 forest[i]=clamp(m[i]*temp[i]*1.58-.17,0,1);
 const channel1=1-Math.abs(Math.sin(X*19+y*13-Z*17));
 const channel2=1-Math.abs(Math.sin(X*31-y*21+Z*11));
 river[i]=clamp(Math.max(channel1*.82,channel2*.55)*m[i]*Math.max(0,E-.435)*3.3,0,1);
 city[i]=E>SEA&&E<.67&&river[i]>.72&&m[i]>.5&&hash(i*131)>.9955?.18:0;
 cloud1[i]=Math.sin(X*12.5+y*7-Z*8.7)+Math.sin(X*4.8-y*10.8+Z*4.2)>.63?1:0;
 cloud2[i]=Math.sin(X*8.1-y*13.4+Z*6.7)+Math.sin(X*17+y*4.5-Z*12)>.95?1:0;
}
let yaw=.45,pitch=-.1,zoom=.42,years=0,last=performance.now(),pointer=null,lx=0,ly=0,spin1=0,spin2=0;const touches=new Map();let ps=0,zs=zoom,img,depth;
function resize(){const d=Math.min(devicePixelRatio||1,1.15),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;img=ctx.createImageData(w,h);depth=new Float32Array(w*h)}}resize();addEventListener('resize',resize);
c.addEventListener('pointerdown',v=>{touches.set(v.pointerId,[v.clientX,v.clientY]);if(touches.size===1){pointer=v.pointerId;lx=v.clientX;ly=v.clientY}else{pointer=null;ps=dist();zs=zoom}c.setPointerCapture?.(v.pointerId)});
c.addEventListener('pointermove',v=>{if(!touches.has(v.pointerId))return;touches.set(v.pointerId,[v.clientX,v.clientY]);if(touches.size>=2){zoom=clamp(zs+(dist()-ps)/220,0,1.55);return}if(v.pointerId!==pointer)return;yaw+=(v.clientX-lx)*.0085;pitch=clamp(pitch+(v.clientY-ly)*.0085,-1.4,1.4);lx=v.clientX;ly=v.clientY});
function release(v){touches.delete(v.pointerId);if(!touches.size)pointer=null;if(touches.size<2)ps=0}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);c.addEventListener('wheel',v=>{v.preventDefault();zoom=clamp(zoom-v.deltaY*.0012,0,1.55)},{passive:false});
speed.addEventListener('input',()=>speedLabel.value=compact(rate())+' yr/s');speedLabel.value=compact(rate())+' yr/s';status.remove();requestAnimationFrame(frame);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.07,(now-last)/1000);last=now;if(pointer===null&&touches.size<2)yaw+=dt*.022;spin1+=dt*.014;spin2-=dt*.009;const rr=rate();years+=rr*dt;evolve(rr*dt);draw(now);yearEl.textContent=formatYears(years);badge.textContent=(zoom>.96?'SURFACE':zoom>.62?'REGIONAL':'ORBIT')+' · LOD '+(zoom>.96?3:zoom>.55?2:1)}
function evolve(step){const k=clamp(step/130000,0,.018),epoch=Math.floor(years/5000);for(let i=epoch%5;i<N;i+=5){const ft=clamp(m[i]*temp[i]*1.62-.14,0,1);forest[i]+=(ft-forest[i])*k;const hab=river[i]*.72+m[i]*.32+temp[i]*.22-Math.max(0,e[i]-.72);if(city[i]>0)city[i]=clamp(city[i]+(hab-city[i])*k*.28,0,1);else if(hab>.85&&hash(i+epoch*313)>.9993)city[i]=.07}}
function draw(now){const w=c.width,h=c.height,D=img.data;D.fill(0);depth.fill(-Infinity);const base=Math.min(w,h),scale=base*(.22+Math.min(zoom,1)*.72+Math.max(0,zoom-1)*1.25),cx=w/2,cyy=h/2,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const oceanR=scale;const ocean=ctx.createRadialGradient(cx-oceanR*.27,cyy-oceanR*.24,oceanR*.08,cx,cyy,oceanR);ocean.addColorStop(0,'#174f75');ocean.addColorStop(.62,'#082d4a');ocean.addColorStop(1,'#031522');ctx.fillStyle=ocean;ctx.beginPath();ctx.arc(cx,cyy,oceanR,0,Math.PI*2);ctx.fill();
 const stride=zoom>.9?1:zoom>.5?2:3;
 for(let oi=0;oi<N;oi+=stride){const i=order[oi],X=p[i*3],Y=p[i*3+1],Z=p[i*3+2];let xx=X*cy-Z*sy,zz=X*sy+Z*cy,yy=Y*cp-zz*sp;zz=Y*sp+zz*cp;const R=1+(e[i]-SEA)*.095;xx*=R;yy*=R;zz*=R;if(zz<=0||e[i]<SEA-.012)continue;const px=Math.round(cx+xx*scale),py=Math.round(cyy-yy*scale);if(px<0||py<0||px>=w||py>=h)continue;const di=py*w+px;if(zz<=depth[di])continue;depth[di]=zz;const C=color(i),L=clamp(.24-xx*.16+yy*.12+zz*.94,.13,1.28),q=di*4;D[q]=Math.min(255,C[0]*L);D[q+1]=Math.min(255,C[1]*L);D[q+2]=Math.min(255,C[2]*L);D[q+3]=255;if(zoom>1.05){paintNeighbor(px+1,py,zz-.0001,C,L*.82,w,h,D);paintNeighbor(px,py+1,zz-.0001,C,L*.82,w,h,D)}}ctx.putImageData(img,0,0);
 drawCloudLayer(cloud1,yaw+spin1,.13,1.032,zoom>.85?2:3,now);drawCloudLayer(cloud2,yaw+spin2,.08,1.052,zoom>.85?3:4,now+1700);
 const rim=ctx.createRadialGradient(cx-oceanR*.28,cyy-oceanR*.25,oceanR*.3,cx,cyy,oceanR*1.08);rim.addColorStop(.79,'rgba(45,130,215,0)');rim.addColorStop(.96,'rgba(65,155,245,.07)');rim.addColorStop(1,'rgba(105,205,255,.42)');ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cyy,oceanR*1.07,0,Math.PI*2);ctx.fill();
 if(zoom>1.14){ctx.fillStyle='rgba(210,235,255,.7)';ctx.font=Math.max(10,base*.014)+'px system-ui';ctx.fillText('surface streaming preview',12,32)}
 function paintNeighbor(px,py,z,C,L,w,h,D){if(px<0||py<0||px>=w||py>=h)return;const di=py*w+px;if(z<=depth[di])return;depth[di]=z;const q=di*4;D[q]=Math.min(255,C[0]*L);D[q+1]=Math.min(255,C[1]*L);D[q+2]=Math.min(255,C[2]*L);D[q+3]=255}
 function drawCloudLayer(mask,angle,alpha,rad,stride,phase){const ca=Math.cos(angle),sa=Math.sin(angle);ctx.globalAlpha=alpha+Math.sin(phase*.00016)*.025;ctx.fillStyle='#edf9ff';for(let i=0;i<N;i+=stride){if(!mask[i])continue;const X=p[i*3],Y=p[i*3+1],Z=p[i*3+2];let xx=X*ca-Z*sa,zz=X*sa+Z*ca,yy=Y*cp-zz*sp;zz=Y*sp+zz*cp;if(zz<=0)continue;const px=cx+xx*scale*rad,py=cyy-yy*scale*rad;ctx.fillRect(px,py,zoom>.85?1.35:1,zoom>.85?1.35:1)}ctx.globalAlpha=1}}
function color(i){if(temp[i]<.13||e[i]>.86)return[226,236,242];if(river[i]>.64)return[24,145,205];if(city[i]>.07)return[250,170+city[i]*42,58];if(m[i]<.2)return[174,132,61];const F=forest[i],alt=clamp((e[i]-SEA)/.4,0,1);return[48+(1-F)*50+alt*25,90+F*92-alt*18,42+F*34-alt*4]}
function dist(){const a=[...touches.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}function rate(){return Number(speed.value)<.05?0:Math.pow(10,Number(speed.value))}function compact(v){return v<1000?Math.round(v).toLocaleString():v<1e6?(v/1000).toFixed(v<10000?1:0)+'k':(v/1e6).toFixed(1)+'M'}function formatYears(v){return v<1000?Math.floor(v).toLocaleString()+' years':v<1e6?(v/1000).toFixed(1)+' thousand years':v<1e9?(v/1e6).toFixed(2)+' million years':(v/1e9).toFixed(2)+' billion years'}function hash(v){let h=Math.imul(v^0x9e3779b9,2654435761);h^=h>>>16;return(h>>>0)/4294967295}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
}catch(err){status.textContent='Unable to start: '+err.message}
})();
</script></body></html>
