<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#02060b" />
  <title>Reality Sandbox</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;padding:10px 12px;border:1px solid rgba(145,185,215,.18);border-radius:14px;background:rgba(5,12,20,.46);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.3)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#dbeeff;font-size:.78rem;margin-bottom:7px}.time{font-variant-numeric:tabular-nums;font-weight:700}.hint{color:#8ea6b8;text-align:right}.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px}.row label{font-size:.7rem;color:#91a6b7}.row output{font-size:.7rem;color:#b9d6e9;min-width:68px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#8fc6ff}.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;color:#cfe8fa;background:rgba(5,12,20,.75);padding:10px 14px;border-radius:12px;font-size:.85rem;pointer-events:none;white-space:nowrap}.status.error{color:#ffb4a8;border:1px solid rgba(255,110,90,.35)}@media(min-width:780px){.hud{left:50%;right:auto;width:min(620px,calc(100vw - 24px));transform:translateX(-50%)}}</style>
</head>
<body>
  <div id="app"></div>
  <div id="status" class="status">Starting…</div>
  <section class="hud" aria-label="Simulation time controls">
    <div class="top"><span id="year" class="time">0 years</span><span class="hint">drag · pinch · scroll</span></div>
    <div class="row"><label for="timeSpeed">TIME</label><input id="timeSpeed" type="range" min="0" max="6" step="0.01" value="2.6"><output id="speedLabel">1,000 yr/s</output></div>
  </section>
  <script type="module" src="./reality-lab-standalone.js?v=5"></script>
</body>
</html>
