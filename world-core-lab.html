<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09111a" />
  <title>Reality Sandbox — World Core 0.1</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09111a;color:#edf4ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:max(16px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}.shell{max-width:840px;margin:auto}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#8fa2b7}.title{margin:.4rem 0 .35rem;font-size:clamp(1.7rem,7vw,2.6rem)}.sub{margin:0 0 16px;color:#a9b7c6;line-height:1.45}.card{background:#0e1924;border:1px solid #223446;border-radius:16px;padding:14px;margin:12px 0}.status{display:flex;gap:10px;align-items:center;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#6ee391;box-shadow:0 0 16px rgba(110,227,145,.65)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{background:#0a121b;border:1px solid #1c2c3a;border-radius:11px;padding:10px}.metric b{display:block;font-size:.68rem;color:#8fa0b2;margin-bottom:5px}.metric span{font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px}.actions button{flex:1;border:1px solid #30475d;border-radius:10px;background:#16283a;color:#eef5ff;padding:11px;font:inherit;font-weight:700}.timeline{display:grid;gap:8px}.event{border-left:3px solid #78a9df;background:#0a131d;border-radius:8px;padding:9px 10px}.event small{color:#8fa0b2}.json{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#070c12;border:1px solid #192734;border-radius:10px;padding:11px;max-height:320px;overflow:auto}@media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{display:grid}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Isolated engine test</div>
    <h1 class="title">World Core 0.1</h1>
    <p class="sub">Deterministic simulation clock, persistent entities, save/load snapshots, and an inspectable event-causality graph.</p>
    <section class="card"><div id="status" class="status"><span class="dot"></span><span>Starting…</span></div></section>
    <section class="card grid">
      <div class="metric"><b>World age</b><span id="age">0 yr</span></div>
      <div class="metric"><b>Ticks</b><span id="ticks">0</span></div>
      <div class="metric"><b>Entities</b><span id="entities">0</span></div>
      <div class="metric"><b>History events</b><span id="events">0</span></div>
    </section>
    <section class="card actions">
      <button id="step">Advance 100 years</button>
      <button id="save">Save snapshot</button>
      <button id="load">Reload snapshot</button>
      <button id="determinism">Test determinism</button>
    </section>
    <section class="card"><h3>Timeline</h3><div id="timeline" class="timeline"></div></section>
    <section class="card"><h3>Latest causality tree</h3><pre id="causality" class="json"></pre></section>
    <section class="card"><h3>Snapshot</h3><pre id="snapshot" class="json"></pre></section>
  </main>
  <script type="module" src="./world-core-lab.js?v=1"></script>
</body>
</html>
