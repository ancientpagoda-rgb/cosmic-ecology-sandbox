<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Hex Sphere + Octree Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef5ff;font-family:system-ui;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}.shell{max-width:900px;margin:auto}h1{margin:.2rem 0}.sub{color:#aebbc9;line-height:1.4}.panel{background:#0d1721;border:1px solid #213243;border-radius:16px;padding:12px}canvas{display:block;width:100%;height:min(64vh,620px);background:#071018;border-radius:12px;touch-action:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:#081018;border:1px solid #1a2835;border-radius:10px;padding:9px}.stat b{display:block;font-size:.68rem;color:#8e9dab}.stat span{font-variant-numeric:tabular-nums}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}canvas{height:52vh}}</style></head><body><main class="shell"><h1>Hex Sphere + Octree</h1><p class="sub">Drag to rotate. Tap a cell to query the 3D octree. The geodesic grid is hex-dominant with 12 pentagons, which every closed spherical hex grid requires.</p><section class="panel"><canvas id="world" width="640" height="520"></canvas><div class="stats"><div class="stat"><b>Cells</b><span id="cells">0</span></div><div class="stat"><b>Hexagons</b><span id="hexes">0</span></div><div class="stat"><b>Pentagons</b><span id="pentagons">0</span></div><div class="stat"><b>Octree nodes</b><span id="nodes">0</span></div><div class="stat"><b>Selected cell</b><span id="selected">—</span></div><div class="stat"><b>Neighbors</b><span id="neighbors">—</span></div><div class="stat"><b>Nearby query</b><span id="nearby">—</span></div><div class="stat"><b>Tree depth</b><span id="depth">0</span></div></div></section></main><script type="module" src="./hex-octree-lab.js?v=1"></script></body></html>
