<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reality Sandbox</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="sphere.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Reality Sandbox</h1>
      <p class="tagline">Deterministic ecosystem evolving across one continuous spherical world.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <div class="transport">
        <button id="startButton">Start</button>
        <button id="pauseButton" disabled>Pause</button>
        <button id="stepButton" disabled>Step</button>
      </div>
      <div class="tools">
        <button id="spawnAgentButton">+ Agent</button>
        <button id="spawnResourceButton">+ Resource</button>
        <button id="forceBrushButton" data-mode="force">Force Brush</button>
        <button id="zoomInButton">Zoom +</button>
        <button id="zoomOutButton">Zoom −</button>
      </div>
      <div class="status">
        <span id="tickLabel">Tick: 0</span>
        <span id="seedLabel">Seed: <code id="seedValue"></code></span>
      </div>
    </section>

    <section class="main-panel">
      <canvas id="world" aria-label="Spherical Reality Sandbox world"></canvas>
    </section>

    <footer>
      <p>Longitude wraps continuously; crossing a pole reflects latitude and rotates longitude halfway around the globe.</p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
