<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050812" />
  <title>Reality Sandbox</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="living.css" />
  <link rel="stylesheet" href="immersive.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Reality Sandbox</h1>
      <p class="tagline">A living planet with weather, geology, evolution, and history.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <div class="transport">
        <button id="startButton">Start</button>
        <button id="pauseButton" disabled>Pause</button>
        <button id="stepButton">Step</button>
      </div>
      <div class="tools">
        <button id="spawnAgentButton">+ Animal</button>
        <button id="spawnResourceButton">+ Plant</button>
        <button id="forceBrushButton">Force Brush</button>
        <button id="zoomInButton">Zoom +</button>
        <button id="zoomOutButton">Zoom −</button>
        <button id="deepZoomButton">Surface View</button>
      </div>
    </section>

    <section class="simulation-layout">
      <section class="main-panel">
        <div id="world" aria-label="Interactive living 3D planet"></div>
        <div id="narrator" class="narrator" aria-live="polite"></div>
        <aside id="inspector" class="inspector" aria-label="Explorer information">
          <button id="closeInspector" aria-label="Close explorer">×</button>
          <h2 id="inspectorTitle">Explorer</h2>
          <div id="inspectorBody"></div>
        </aside>
      </section>

      <aside class="history-panel" aria-label="World history">
        <h2>World History</h2>
        <ol id="historyList"></ol>
      </aside>
    </section>

    <footer>
      <p>Tap the globe to explore a region. Drag to rotate. Pinch or use Zoom. Weather, clouds, sunlight, ecosystems, and tectonic events evolve continuously.</p>
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
