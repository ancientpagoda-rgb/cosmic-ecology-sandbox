<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reality Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Reality Sandbox</h1>
      <p class="tagline">A living ecosystem evolving across a rotating world.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <div class="transport">
        <button id="startButton">Start</button>
        <button id="pauseButton" disabled>Pause</button>
        <button id="stepButton">Step</button>
      </div>
      <div class="tools">
        <button id="spawnAgentButton">+ Agent</button>
        <button id="spawnResourceButton">+ Resource</button>
        <button id="forceBrushButton">Force Brush</button>
        <button id="zoomInButton">Zoom +</button>
        <button id="zoomOutButton">Zoom −</button>
      </div>
    </section>

    <section class="main-panel">
      <div id="world" aria-label="Interactive 3D Reality Sandbox globe"></div>
    </section>

    <footer>
      <p>Drag to rotate. Scroll or use Zoom. Force Brush paints directly onto the globe; hold Shift for repulsion.</p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
